# Fly.io example — create app + volume, then: fly deploy
# fly volumes create data --size 1 --region iad

app = "codenda"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  ENVIRONMENT = "production"
  SERVE_STATIC = "true"
  DATA_DIR = "/app/data"
  STATIC_DIR = "/app/frontend/dist"

[http_service]
  internal_port = 8001
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health"

[[mounts]]
  source = "data"
  destination = "/app/data"
