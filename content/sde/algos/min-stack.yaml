      prompt: 'Rung 1: set up the start (structures / first line). Different variable names.'
      prompt_es: 'Peldaño 1: arma el inicio (estructuras / primera línea). Otras variables.'
      starter_code: "object[] MinStackOps(object[][] nums)\n{\n    ___\n    var mins = new List<int>();\n\
        \    var output = new List<object>();\n    foreach (var op in nums)\n    {\n        var name =\
        \ Convert.ToString(op[0]);\n        if (name == \"push\")\n        {\n            int v = Convert.ToInt32(op[1]);\n\
        \            stack.Add(v);\n            mins.Add(mins.Count == 0 ? v : Math.Min(v, mins[mins.Count\
        \ - 1]));\n            output.Add(null);\n        }\n        else if (name == \"pop\")\n     \
        \   {\n            stack.RemoveAt(stack.Count - 1);\n            mins.RemoveAt(mins.Count - 1);\n\
        \            output.Add(null);\n        }\n        else if (name == \"top\")\n            output.Add(stack[stack.Count\
        \ - 1]);\n        else if (name == \"getMin\")\n            output.Add(mins[mins.Count - 1]);\n\
        \    }\n    return output.ToArray();\n}\n"
