      starter_code: "string MinWindow(string s, string text)\n{\n    ___\n    var need = new Dictionary<char,\
        \ int>();\n    foreach (var c in text)\n        need[c] = need.GetValueOrDefault(c) + 1;\n   \
        \ int missing = text.Length, left = 0, bestLen = 0;\n    string best = \"\";\n    for (int right\
        \ = 0; right < s.Length; right++)\n    {\n        char c = s[right];\n        if (need.ContainsKey(c))\n\
        \        {\n            if (need[c] > 0) missing--;\n            need[c]--;\n        }\n     \
        \   while (missing == 0)\n        {\n            if (bestLen == 0 || right - left + 1 < bestLen)\n\
        \            {\n                bestLen = right - left + 1;\n                best = s.Substring(left,\
        \ bestLen);\n            }\n            char leftC = s[left];\n            if (need.ContainsKey(leftC))\n\
        \            {\n                need[leftC]++;\n                if (need[leftC] > 0) missing++;\n\
