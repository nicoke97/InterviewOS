      starter_code: "bool IsValidParen(string s)\n{\n    ___\n    var pairs = new Dictionary<char, char>\
        \ { [')'] = '(', ['}'] = '{', [']'] = '[' };\n    foreach (var c in s)\n    {\n        if (pairs.ContainsKey(c))\n\
        \        {\n            if (stack.Count == 0 || stack.Pop() != pairs[c]) return false;\n     \
        \   }\n        else stack.Push(c);\n    }\n    return stack.Count == 0;\n}\n"
