id: valid-parentheses
title: Valid Parentheses
leetcode_id: lc-valid-parentheses
test_cases:
- args:
  - ()
  expected: true
- args:
  - ()[]{}
  expected: true
- args:
  - (]
  expected: false
voice:
  prompt: ¿Por qué stack y no otro enfoque?
  prompt_en: Explain the approach and the complexity out loud.
  keywords:
  - o(n)
  - o(1)
  - complejidad
  - enfoque
  - stack
  - paréntesis
  - expresiones
  - monotonic
  - mínimos
  - máximos
