        bool IsValidBst(object target)\n{\n    ___\n    foreach (var x in (System.Collections.IEnumerable)target)\n\
        \        nodes.Add(x == null ? null : Convert.ToInt32(x));\n    if (nodes.Count == 0) return true;\n\
        \    TNode Build(int i)\n    {\n        if (i >= nodes.Count || nodes[i] == null) return null;\n\
        \        return new TNode { V = nodes[i].Value, L = Build(2 * i + 1), R = Build(2 * i + 2) };\n\
        \    }\n    bool Valid(TNode node, long lo, long hi)\n    {\n        if (node == null) return\
        \ true;\n        if (node.V <= lo || node.V >= hi) return false;\n        return Valid(node.L,\
        \ lo, node.V) && Valid(node.R, node.V, hi);\n    }\n    return Valid(Build(0), long.MinValue,\
        \ long.MaxValue);\n}\n"
