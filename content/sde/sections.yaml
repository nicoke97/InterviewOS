    front: What does EF Core's change tracker do?
    front_es: ¿Qué hace el change tracker de EF Core?
    back: It keeps snapshots of loaded entities so it can detect what changed and generate the right INSERT/UPDATE/DELETE
      statements when you call SaveChanges().
    back_es: Guarda snapshots de las entidades cargadas para detectar qué cambió y generar los INSERT/UPDATE/DELETE
      correctos cuando llamas SaveChanges().
  - id: w10-ef-s2-c2
    front: Why use .AsNoTracking() for read-only queries?
    front_es: ¿Por qué usar .AsNoTracking() en queries de solo lectura?
    back: It skips the overhead of tracking changes for entities you're never going to update, improving
      performance for pure read scenarios.
    back_es: Se salta el costo de rastrear cambios en entidades que nunca vas a actualizar, mejorando
      el rendimiento en escenarios de solo lectura.
