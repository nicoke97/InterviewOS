  cards:
  - id: w15-gil-py-s1-c1
    front: What is the GIL (Global Interpreter Lock) in CPython?
    front_es: ¿Qué es el GIL (Global Interpreter Lock) en CPython?
    back: A lock that allows only one thread to execute Python bytecode at a time, even on a multi-core
      machine.
    back_es: Un lock que permite que solo un thread ejecute bytecode de Python a la vez, incluso en una
      máquina multi-core.
  - id: w15-gil-py-s1-c2
    front: Why does CPython have the GIL?
    front_es: ¿Por qué CPython tiene el GIL?
    back: CPython's memory management (reference counting) isn't thread-safe by default; the GIL avoids
      the overhead and complexity of fine-grained locking around every object's refcount.
    back_es: El manejo de memoria de CPython (conteo de referencias) no es thread-safe por default; el
      GIL evita el costo y la complejidad de poner locks finos alrededor del refcount de cada objeto.
