  cards:
  - id: w11-di-asp-s1-c1
    front: What's the difference between Transient, Scoped, and Singleton service lifetimes in ASP.NET
      Core DI?
    front_es: ¿Cuál es la diferencia entre los lifetimes Transient, Scoped y Singleton en DI de ASP.NET
      Core?
    back: 'Transient: a new instance every time it''s resolved. Scoped: one instance per HTTP request.
      Singleton: one instance for the whole application''s lifetime.'
    back_es: 'Transient: una instancia nueva cada vez que se resuelve. Scoped: una instancia por request
      HTTP. Singleton: una instancia para toda la vida de la app.'
  - id: w11-di-asp-s1-c2
    front: Why is EF Core's DbContext typically registered as Scoped?
    front_es: ¿Por qué el DbContext de EF Core normalmente se registra como Scoped?
    back: It should track changes for exactly one unit of work — shared within a request but not reused
      across requests (which would leak stale tracked state) and not recreated on every resolve (which
      would break tracking within the request).
    back_es: Debe rastrear cambios para exactamente una unidad de trabajo — compartido dentro de un request
      pero no reusado entre requests (lo que dejaría estado rastreado viejo) y no recreado en cada resolve
      (lo que rompería el tracking dentro del request).
  standard_minutes: 35
