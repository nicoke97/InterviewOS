    front: What are the two common ways to version a REST API?
    front_es: ¿Cuáles son las dos formas comunes de versionar una REST API?
    back: URL versioning (e.g. /v2/orders) or a request header (e.g. an Accept/version header).
    back_es: Versionado en la URL (ej. /v2/orders) o en un header del request (ej. un header de Accept/version).
  - id: w02-rest-s4-c2
    front: What counts as a breaking API change?
    front_es: ¿Qué cuenta como un breaking change en una API?
    back: 'Anything that makes existing clients fail or misbehave: removing/renaming a field, changing
      a field''s type or meaning, changing required params, or changing status code semantics.'
    back_es: 'Cualquier cosa que haga fallar o comportarse mal a los clientes existentes: quitar/renombrar
      un campo, cambiar su tipo o significado, cambiar params requeridos, o cambiar la semántica de los
      status codes.'
  - id: w02-rest-s4-c3
    front: If an upstream API makes a breaking change without notice, what's a safe migration strategy?
    front_es: Si una API upstream hace un breaking change sin avisar, ¿cuál es una estrategia segura de
      migración?
    back: 'Dual-run: keep the old integration live while building and validating the new one side-by-side,
      diffing responses, and only cut over once the new path is verified.'
    back_es: 'Dual-run: mantener viva la integración vieja mientras construyes y validas la nueva en paralelo,
      comparando las respuestas, y solo cortar cuando la nueva ya esté verificada.'
