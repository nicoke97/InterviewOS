  - id: w03-sql-s1-c2
    front: When would you use RIGHT JOIN instead of LEFT JOIN?
    front_es: ¿Cuándo usarías RIGHT JOIN en vez de LEFT JOIN?
    back: They're symmetric — RIGHT JOIN is a LEFT JOIN with the tables swapped. Most people standardize
      on LEFT JOIN and just reorder the tables instead.
    back_es: Son simétricos — RIGHT JOIN es un LEFT JOIN con las tablas al revés. La mayoría estandariza
      en LEFT JOIN y solo reordena las tablas.
