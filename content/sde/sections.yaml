    front: What do trigger, stage, and job mean in an Azure DevOps YAML pipeline?
    front_es: ¿Qué significan trigger, stage y job en un pipeline YAML de Azure DevOps?
    back: trigger defines what starts the pipeline (e.g. a push to a branch); a stage is a major phase
      (build, test, deploy); a job is a set of steps that run on one agent within a stage.
    back_es: trigger define qué arranca el pipeline (ej. un push a una branch); un stage es una fase grande
      (build, test, deploy); un job es un conjunto de steps que corren en un agent dentro de un stage.
  - id: w05-azdo-s2-c2
    front: Why call the pipeline YAML 'the build contract'?
    front_es: ¿Por qué llamar al YAML del pipeline 'el contrato del build'?
    back: It's the single source of truth, checked into source control, defining exactly how the code
      is built, tested, and deployed — reviewable and versioned like any other code.
    back_es: Es la única fuente de verdad, versionada en el control de fuente, que define exactamente
      cómo se construye, prueba y despliega el código — revisable y versionada como cualquier otro código.
