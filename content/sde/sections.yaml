  cards:
  - id: w12-solid-s1-c1
    front: What does the Single Responsibility Principle (the S in SOLID) mean?
    front_es: ¿Qué significa el Principio de Responsabilidad Única (la S de SOLID)?
    back: A class/module should have one reason to change — one responsibility — so a change to one concern
      doesn't force unrelated changes elsewhere.
    back_es: Una clase/módulo debería tener una sola razón para cambiar — una responsabilidad — así un
      cambio en un tema no obliga a cambios sin relación en otro lado.
  - id: w12-solid-s1-c2
    front: What does the Open/Closed Principle (the O in SOLID) mean, with an example?
    front_es: ¿Qué significa el Principio Abierto/Cerrado (la O de SOLID), con un ejemplo?
    back: Code should be open for extension but closed for modification — you can add new behavior (e.g.
