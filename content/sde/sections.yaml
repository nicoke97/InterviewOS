  - id: w06-tests-s1-c1
    front: What's the difference between a unit test and an integration test?
    front_es: ¿Cuál es la diferencia entre un unit test y un integration test?
    back: A unit test exercises one unit of code in isolation with its dependencies mocked/faked. An integration
      test exercises real dependencies (an actual DB, an actual HTTP call).
    back_es: Un unit test prueba una sola unidad de código aislada, con sus dependencias mockeadas. Un
      integration test prueba dependencias reales (una DB real, una llamada HTTP real).
  - id: w06-tests-s1-c2
    front: Why do you need both unit and integration tests?
    front_es: ¿Por qué necesitas tanto unit tests como integration tests?
    back: Unit tests are fast and pinpoint logic bugs in isolation. Integration tests catch problems that
      only appear when real components interact (wrong SQL, serialization mismatches, network issues).
    back_es: Los unit tests son rápidos y detectan bugs de lógica aislados. Los integration tests detectan
      problemas que solo aparecen cuando los componentes reales interactúan (SQL mal, serialización que
      no cuadra, problemas de red).
