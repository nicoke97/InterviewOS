    front: What does the yield keyword do in a Python function?
    front_es: ¿Qué hace la palabra yield en una función de Python?
    back: It turns the function into a generator that produces values lazily, one at a time, pausing its
      state between each yield instead of computing the entire result at once.
    back_es: Convierte la función en un generador que produce valores de forma perezosa, uno a la vez,
      pausando su estado entre cada yield en vez de calcular todo el resultado de una vez.
  - id: w15-gil-py-s4-c2
    front: Why use a generator instead of returning a full list for large data?
    front_es: ¿Por qué usar un generador en vez de regresar una lista completa para datos grandes?
    back: It avoids holding the entire dataset in memory at once — useful for large or infinite sequences,
      or streaming data.
    back_es: Evita tener todo el dataset en memoria a la vez — útil para secuencias grandes o infinitas,
      o datos en streaming.
