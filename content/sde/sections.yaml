    front: What's a 'service connection' in Azure DevOps used for?
    front_es: ¿Para qué se usa una 'service connection' en Azure DevOps?
    back: An authenticated link from the pipeline to an external service (Azure subscription, Docker registry,
      etc.) so pipelines can deploy/access resources without hardcoding credentials.
    back_es: Una conexión autenticada del pipeline hacia un servicio externo (suscripción de Azure, registro
      de Docker, etc.) para que el pipeline pueda desplegar/acceder recursos sin hardcodear credenciales.
