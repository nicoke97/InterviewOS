      Core)?
    back: Classic ASP.NET's SynchronizationContext captures the calling context; blocking synchronously
      while that same context is needed to resume the async continuation makes both wait on each other
      forever.
    back_es: El SynchronizationContext de ASP.NET clásico captura el contexto que llama; bloquear de forma
      sincrónica mientras ese mismo contexto se necesita para reanudar la continuación async hace que
      ambos se esperen entre sí para siempre.
  - id: w07-async-cs-s3-c2
    front: What's the standard fix for the .Result/.Wait() deadlock problem?
    front_es: ¿Cuál es la solución estándar al problema de deadlock de .Result/.Wait()?
    back: '"Async all the way" — use await consistently up the whole call chain instead of mixing sync
      blocking calls with async code.'
    back_es: '"Async todo el camino" — usar await de forma consistente en toda la cadena de llamadas en
      vez de mezclar llamadas bloqueantes sync con código async.'
