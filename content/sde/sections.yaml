    front: What do the HTTP status code ranges 2xx, 4xx, and 5xx mean?
    front_es: ¿Qué significan los rangos de status code 2xx, 4xx y 5xx?
    back: 2xx = success, 4xx = client error (bad request, auth, not found), 5xx = server error (something
      broke server-side).
    back_es: 2xx = éxito, 4xx = error del cliente (request mal formado, auth, not found), 5xx = error
      del servidor (algo se rompió del lado del server).
  - id: w02-rest-s1-c2
    front: Why is returning HTTP 200 with an error payload inside (e.g. a SOAP Fault as XML) a broken
      contract?
    front_es: ¿Por qué devolver HTTP 200 con un error adentro (ej. un SOAP Fault en XML) es un contrato
      roto?
    back: Callers, proxies, and monitoring that check only the status code will treat the call as successful
      even though it actually failed — the status code lies.
    back_es: Los callers, proxies y monitoreo que solo revisan el status code van a tratar la llamada
      como exitosa aunque en realidad falló — el status code miente.
  - id: w02-rest-s1-c3
    front: What's the difference between 404, 400, and 409?
    front_es: ¿Cuál es la diferencia entre 404, 400 y 409?
    back: 404 = the resource doesn't exist, 400 = the request itself is malformed/invalid, 409 = conflict
      with the resource's current state (e.g. duplicate, version mismatch).
    back_es: 404 = el recurso no existe, 400 = el request está mal formado/es inválido, 409 = conflicto
      con el estado actual del recurso (ej. duplicado, versión distinta).
