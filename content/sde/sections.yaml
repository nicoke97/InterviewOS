    front: Why is a mutable singleton dangerous in a web API?
    front_es: ¿Por qué es peligroso un singleton mutable en una web API?
    back: It's shared across all concurrent requests; if multiple requests mutate it at the same time
      without synchronization, you get race conditions and data corruption.
    back_es: Se comparte entre todos los requests concurrentes; si varios requests lo mutan al mismo tiempo
      sin sincronización, tienes race conditions y datos corruptos.
  - id: w08-concurrency-s5-c2
    front: What's the safer DI lifetime for per-request state in ASP.NET Core?
    front_es: ¿Cuál es el lifetime de DI más seguro para estado por request en ASP.NET Core?
    back: Scoped — a new instance per HTTP request, so state isn't shared or raced across concurrent requests.
    back_es: Scoped — una instancia nueva por request HTTP, así el estado no se comparte ni se pisa entre
      requests concurrentes.
