    back_es: Corrección (bugs), claridad (nombres), cobertura de tests, y cualquier cambio a un contrato
      público (firma de API, forma de la respuesta) — no preferencias de estilo personales.
  - id: w04-git-s3-c2
    front: Why avoid nitpicking formatting/brace style in review?
    front_es: ¿Por qué evitar comentarios de estilo de formato/llaves en el review?
    back: It wastes review time on low-value issues a linter/formatter should handle automatically, distracting
      from real bugs and design concerns.
    back_es: Desperdicia tiempo de review en cosas de poco valor que un linter/formatter debería manejar
      automático, distrayendo de bugs reales y temas de diseño.
  - id: w04-git-s3-c3
    front: What is a 'contract diff', and why does it deserve extra scrutiny in review?
    front_es: ¿Qué es un 'contract diff', y por qué merece atención extra en el review?
    back: A change to a public interface (API shape, method signature, response schema) that can break
      other consumers — its impact reaches beyond the current PR.
    back_es: Un cambio a una interfaz pública (forma de API, firma de método, schema de respuesta) que
      puede romper a otros consumidores — su impacto va más allá del PR actual.
  standard_minutes: 35
