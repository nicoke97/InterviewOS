    front: Why be cautious using a LINQ operator you don't fully understand against IQueryable?
    front_es: ¿Por qué tener cuidado al usar un operador LINQ que no entiendes bien contra IQueryable?
    back: Not every LINQ operator translates cleanly to SQL; using an unsupported one can force the whole
      query to run client-side (losing DB optimization) or throw a translation error.
    back_es: No todos los operadores LINQ se traducen bien a SQL; usar uno que no se soporta puede forzar
      a que toda la query corra del lado del cliente (perdiendo la optimización de la base) o lanzar un
      error de traducción.
