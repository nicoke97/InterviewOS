    front: What is the Repository pattern?
    front_es: ¿Qué es el patrón Repository?
    back: An abstraction over data access that lets calling code work with domain objects without knowing
      the underlying storage/query details (e.g. IOrderRepository hides the SQL/EF calls).
    back_es: Una abstracción sobre el acceso a datos que le permite al código que llama trabajar con objetos
      de dominio sin conocer los detalles de storage/query de abajo (ej. IOrderRepository esconde las
      llamadas SQL/EF).
  - id: w12-solid-s3-c2
    front: What is the Facade pattern, and how does eLink's single interface over SOAP+REST demonstrate
      it?
    front_es: ¿Qué es el patrón Facade, y cómo la interfaz única de eLink sobre SOAP+REST lo demuestra?
    back: A Facade provides a simple, unified interface over a more complex set of subsystems. eLink's
      single interface hid whether the call went to SOAP or REST underneath, giving callers one simple
      contract.
    back_es: Un Facade da una interfaz simple y unificada sobre un conjunto de subsistemas más complejo.
      La interfaz única de eLink escondía si la llamada iba a SOAP o REST por debajo, dando a quien llama
      un solo contrato simple.
