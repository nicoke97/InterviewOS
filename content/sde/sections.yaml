    front: What is a CancellationToken used for in async code?
    front_es: ¿Para qué se usa un CancellationToken en código async?
    back: A cooperative signal passed into I/O operations so they can stop early if the caller no longer
      needs the result (e.g. the client disconnected, or a timeout elapsed).
    back_es: Una señal cooperativa que se pasa a las operaciones de I/O para que puedan detenerse antes
      si el caller ya no necesita el resultado (ej. el cliente se desconectó, o pasó un timeout).
  - id: w07-async-cs-s5-c2
    front: Why does it matter to respect cancellation on outbound calls to a third-party API?
    front_es: ¿Por qué importa respetar la cancelación en llamadas salientes a una API de terceros?
    back: If the original caller already gave up, continuing to call an external service wastes resources
      and rate-limit budget on work whose result nobody will use.
    back_es: Si el caller original ya se rindió, seguir llamando a un servicio externo desperdicia recursos
      y cuota de rate-limit en trabajo cuyo resultado nadie va a usar.
