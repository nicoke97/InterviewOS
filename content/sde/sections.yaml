    front: What makes a PR easy to review?
    front_es: ¿Qué hace que un PR sea fácil de revisar?
    back: Small, focused scope; a clear description of intent; tests covering the new behavior; no unrelated
      changes mixed in.
    back_es: Alcance chico y enfocado; una descripción clara de la intención; tests que cubran el comportamiento
      nuevo; sin cambios sin relación mezclados.
