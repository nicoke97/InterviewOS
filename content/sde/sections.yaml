  - id: w08-concurrency-s1-c1
    front: What is a race condition?
    front_es: ¿Qué es una race condition?
    back: When two or more threads/requests access and modify shared state concurrently, and the outcome
      depends on unpredictable timing — leading to corrupted or inconsistent data.
    back_es: Cuando dos o más threads/requests acceden y modifican estado compartido al mismo tiempo,
      y el resultado depende del timing impredecible — llevando a datos corruptos o inconsistentes.
  - id: w08-concurrency-s1-c2
    front: What are the two basic strategies to avoid a race condition?
    front_es: ¿Cuáles son las dos estrategias básicas para evitar una race condition?
    back: Synchronize access with a lock so only one thread mutates the state at a time, or avoid sharing
      mutable state altogether (e.g. per-request/scoped state).
    back_es: Sincronizar el acceso con un lock para que solo un thread mute el estado a la vez, o evitar
      compartir estado mutable del todo (ej. estado por request/scoped).
