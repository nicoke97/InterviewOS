    front: What is a Python decorator?
    front_es: ¿Qué es un decorador en Python?
    back: A function that takes another function (or class) and returns a wrapped version, adding behavior
      before/after the original call without modifying its source (e.g. @lru_cache, @staticmethod).
    back_es: Una función que recibe otra función (o clase) y regresa una versión envuelta, agregando comportamiento
      antes/después de la llamada original sin modificar su código fuente (ej. @lru_cache, @staticmethod).
  - id: w15-gil-py-s3-c2
    front: What does Python's with statement do?
    front_es: ¿Qué hace la sentencia with en Python?
    back: It manages a context manager's setup/teardown (__enter__/__exit__), guaranteeing cleanup (like
      closing a file) even if an exception occurs — similar to C#'s using.
    back_es: Maneja el setup/teardown de un context manager (__enter__/__exit__), garantizando la limpieza
      (como cerrar un archivo) incluso si hay una excepción — similar a using en C#.
