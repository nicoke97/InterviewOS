    front: What do Where, Select, and GroupBy do in LINQ?
    front_es: ¿Qué hacen Where, Select y GroupBy en LINQ?
    back: Where filters elements by a predicate, Select projects/transforms each element into a new shape,
      GroupBy buckets elements by a key.
    back_es: Where filtra elementos por un predicado, Select proyecta/transforma cada elemento en una
      forma nueva, GroupBy agrupa elementos por una llave.
