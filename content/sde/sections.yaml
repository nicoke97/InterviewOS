  - id: w03-sql-s5-c1
    front: What is the N+1 query problem?
    front_es: ¿Qué es el problema N+1 de queries?
    back: Running one query to get a list, then N more queries — one per row — to fetch related data,
      instead of one query (a join) that gets everything at once.
    back_es: Correr una query para obtener una lista, y luego N queries más — una por fila — para traer
      datos relacionados, en vez de una sola query (un join) que trae todo junto.
  - id: w03-sql-s5-c2
    front: What does EXPLAIN (or EXPLAIN ANALYZE) show you, at a high level?
    front_es: ¿Qué te muestra EXPLAIN (o EXPLAIN ANALYZE), a alto nivel?
    back: 'The query''s execution plan: whether it uses an index or a full table scan, join order, and
      estimated/actual row counts and cost — used to spot slow queries.'
    back_es: 'El plan de ejecución de la query: si usa un índice o hace full table scan, el orden de los
      joins, y el número de filas/costo estimado o real — se usa para detectar queries lentas.'
  - id: w03-sql-s5-c3
    front: How does N+1 typically show up when using an ORM like EF Core?
    front_es: ¿Cómo aparece típicamente el N+1 al usar un ORM como EF Core?
    back: Lazy-loading a navigation property inside a loop fires one query per item. Fix it with eager
      loading (Include) or a projection (Select) that pulls related data in the original query.
    back_es: Cargar una navigation property de forma lazy dentro de un loop dispara una query por elemento.
      Se arregla con eager loading (Include) o una proyección (Select) que trae los datos relacionados
      en la query original.
  standard_minutes: 35
