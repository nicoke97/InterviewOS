  - id: w04-git-s1-c1
    front: Why keep feature branches short-lived?
    front_es: ¿Por qué mantener las branches de features cortas?
    back: Long-lived branches drift far from main, causing large, painful merge conflicts. Short branches
      merge often and stay easy to integrate.
    back_es: Las branches que viven mucho tiempo se alejan de main, causando conflictos de merge grandes
      y dolorosos. Las branches cortas se mergean seguido y son fáciles de integrar.
  - id: w04-git-s1-c2
    front: What's the trade-off between git rebase and git merge?
    front_es: ¿Cuál es el trade-off entre git rebase y git merge?
    back: Rebase rewrites commit history onto a new base for a clean linear history, but rewrites shared
      commits (risky on shared branches). Merge preserves true history with a merge commit — safer for
      shared branches but noisier.
    back_es: Rebase reescribe el historial de commits sobre una base nueva para un historial lineal y
      limpio, pero reescribe commits compartidos (riesgoso en branches compartidas). Merge conserva el
      historial real con un merge commit — más seguro en branches compartidas pero más ruidoso.
  - id: w04-git-s1-c3
    front: How should merge conflicts be handled?
    front_es: ¿Cómo se deben resolver los conflictos de merge?
    back: By deliberately understanding both changes and picking/combining the correct result — never
      by blindly accepting one side or hiding the conflict.
    back_es: Entendiendo a propósito ambos cambios y eligiendo/combinando el resultado correcto — nunca
      aceptando un lado a ciegas o escondiendo el conflicto.
  standard_minutes: 35
