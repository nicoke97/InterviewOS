  - id: w03-sql-s4-c1
    front: What is a database transaction, and what does BEGIN/COMMIT do?
    front_es: ¿Qué es una transacción de base de datos, y qué hace BEGIN/COMMIT?
    back: A transaction groups multiple statements into one atomic unit of work. BEGIN starts it; COMMIT
      makes all its changes permanent (or ROLLBACK undoes them all).
    back_es: Una transacción agrupa varias sentencias en una sola unidad atómica de trabajo. BEGIN la
      inicia; COMMIT hace permanentes todos sus cambios (o ROLLBACK los deshace a todos).
  - id: w03-sql-s4-c2
    front: What does 'atomicity' guarantee for an order insert across multiple tables?
    front_es: ¿Qué garantiza la 'atomicidad' al insertar una orden en varias tablas?
    back: The order and all its related rows (line items, inventory updates, etc.) either all get written,
      or none do — no partial/half-written order.
    back_es: La orden y todas sus filas relacionadas (líneas, actualización de inventario, etc.) se escriben
      todas o ninguna — nunca una orden a medias.
  - id: w03-sql-s4-c3
    front: What is a 'dirty read', and why is preventing it usually the minimum isolation level?
    front_es: ¿Qué es un 'dirty read', y por qué evitarlo suele ser el nivel mínimo de isolation?
    back: A dirty read happens when a transaction reads uncommitted changes from another transaction that
      might later roll back. Most systems default to at least READ COMMITTED to prevent this.
    back_es: Un dirty read pasa cuando una transacción lee cambios sin commit de otra transacción que
      después puede hacer rollback. La mayoría de sistemas usa por default al menos READ COMMITTED para
      evitarlo.
