    front: When should you choose asyncio vs threading vs multiprocessing in Python?
    front_es: ¿Cuándo deberías elegir asyncio vs threading vs multiprocessing en Python?
    back: asyncio for lots of I/O-bound concurrency on one thread; multiprocessing for CPU-bound work
      that needs real parallel execution across cores; threading mainly helps with I/O-bound blocking
      calls that aren't async-compatible.
    back_es: asyncio para mucha concurrencia I/O-bound en un solo thread; multiprocessing para trabajo
      CPU-bound que necesita paralelismo real entre cores; threading ayuda sobre todo con llamadas bloqueantes
      I/O-bound que no son compatibles con async.
  - id: w14-gc-asyncio-s4-c2
    front: Why doesn't Python threading help much for CPU-bound work?
    front_es: ¿Por qué el threading de Python no ayuda mucho para trabajo CPU-bound?
    back: The GIL (Global Interpreter Lock) only lets one thread execute Python bytecode at a time, so
      multiple threads doing CPU-bound work don't run in true parallel.
    back_es: El GIL (Global Interpreter Lock) solo deja que un thread ejecute bytecode de Python a la
      vez, así que varios threads haciendo trabajo CPU-bound no corren en paralelo real.
  standard_minutes: 35
