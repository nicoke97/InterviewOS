  - id: w16-sa-pytest-s3-c2
    front: Why might pytest fixtures be preferred over unittest's TestCase.setUp()?
    front_es: ¿Por qué se prefieren los fixtures de pytest sobre TestCase.setUp() de unittest?
    back: Fixtures are more flexible and composable — shareable across test files, parametrizable, scoped
      (function/class/module/session), and don't force a class-based test structure.
    back_es: Los fixtures son más flexibles y componibles — se comparten entre archivos de test, se pueden
      parametrizar, tienen scope (function/class/module/session), y no obligan a una estructura de test
      basada en clases.
