    front: What's the queue + worker pattern, and why use it?
    front_es: ¿Qué es el patrón cola + worker, y por qué usarlo?
    back: The request publishes a message to a queue and returns immediately; a separate worker consumes
      the message and does the (possibly slow) work asynchronously — keeps the request/response fast and
      decouples producer from consumer.
    back_es: El request publica un mensaje a una cola y regresa de inmediato; un worker separado consume
      el mensaje y hace el trabajo (posiblemente lento) de forma asíncrona — mantiene rápido el request/response
      y desacopla productor de consumidor.
  - id: w08-concurrency-s4-c2
    front: Why shouldn't slow or unreliable work happen inline during the HTTP request?
    front_es: ¿Por qué el trabajo lento o poco confiable no debería hacerse dentro del request HTTP?
    back: It ties up the request thread and makes the user wait on (or fail because of) work that doesn't
      need to be synchronous; offloading it to a queue improves latency and resilience.
    back_es: Ocupa el thread del request y hace que el usuario espere (o falle) por trabajo que no necesita
      ser síncrono; mandarlo a una cola mejora la latencia y la resiliencia.
