    front: What is horizontal scaling, and how does load balancing relate to it?
    front_es: ¿Qué es el escalamiento horizontal, y cómo se relaciona con el load balancing?
    back: Horizontal scaling adds more instances of your service; a load balancer distributes incoming
      requests across those instances.
    back_es: El escalamiento horizontal agrega más instancias de tu servicio; un load balancer distribuye
      los requests entrantes entre esas instancias.
  - id: w13-scale-s2-c2
    front: Why does storing session state in server memory break under horizontal scaling?
    front_es: ¿Por qué guardar el estado de sesión en memoria del server se rompe con el escalamiento
      horizontal?
    back: A later request from the same user might land on a different instance that doesn't have that
      in-memory session, causing inconsistent behavior — session state needs to be external or the load
      balancer needs sticky sessions.
    back_es: Un request posterior del mismo usuario puede caer en otra instancia que no tiene esa sesión
      en memoria, causando comportamiento inconsistente — el estado de sesión necesita ser externo o el
      load balancer necesita sticky sessions.
