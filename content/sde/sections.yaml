  - id: w07-async-cs-s4-c1
    front: What does ConfigureAwait(false) do?
    front_es: ¿Qué hace ConfigureAwait(false)?
    back: It tells the awaiter not to resume the continuation on the original SynchronizationContext,
      avoiding the cost (and deadlock risk) of capturing and restoring that context.
    back_es: Le dice al awaiter que no reanude la continuación en el SynchronizationContext original,
      evitando el costo (y riesgo de deadlock) de capturar y restaurar ese contexto.
  - id: w07-async-cs-s4-c2
    front: Do you need ConfigureAwait(false) in a modern ASP.NET Core controller? Why or why not?
    front_es: ¿Necesitas ConfigureAwait(false) en un controller moderno de ASP.NET Core? ¿Por qué sí o
      no?
    back: Not really — ASP.NET Core doesn't install a SynchronizationContext, so there's nothing to capture;
      it becomes a functional no-op there. It's still important in reusable library code, which might
      run under a host (WPF, WinForms, classic ASP.NET) that does have one.
    back_es: No de verdad — ASP.NET Core no instala un SynchronizationContext, así que no hay nada que
      capturar; ahí es básicamente un no-op. Sigue siendo importante en código de librería reutilizable,
      que puede correr en un host (WPF, WinForms, ASP.NET clásico) que sí tiene uno.
