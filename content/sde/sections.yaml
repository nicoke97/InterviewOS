  cards:
  - id: w11-di-asp-s4-c1
    front: Describe the ASP.NET Core request pipeline at a high level.
    front_es: Describe a alto nivel el pipeline de requests de ASP.NET Core.
    back: An incoming request flows through a chain of middleware (each can inspect/modify it or short-circuit),
      reaches routing, hits the matched endpoint/controller action which builds a response, and that response
      flows back out through the same middleware chain in reverse.
    back_es: Un request entrante pasa por una cadena de middleware (cada uno puede inspeccionarlo/modificarlo
      o cortar el flujo), llega al routing, entra al endpoint/acción del controller que construye una
      respuesta, y esa respuesta sale de nuevo por la misma cadena de middleware al revés.
