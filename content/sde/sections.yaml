  cards:
  - id: w09-linq-s2-c1
    front: What's the key difference between IQueryable<T> and IEnumerable<T> in LINQ-to-SQL/EF?
    front_es: ¿Cuál es la diferencia clave entre IQueryable<T> e IEnumerable<T> en LINQ-to-SQL/EF?
    back: IQueryable builds an expression tree that gets translated into SQL and executed on the database.
      IEnumerable operates in memory on objects already fetched.
    back_es: IQueryable construye un árbol de expresión que se traduce a SQL y se ejecuta en la base de
      datos. IEnumerable opera en memoria sobre objetos que ya fueron traídos.
  - id: w09-linq-s2-c2
    front: How does switching from IQueryable to IEnumerable too early cause the N+1 problem?
    front_es: ¿Cómo cambiar de IQueryable a IEnumerable muy pronto causa el problema N+1?
    back: Once you're on IEnumerable (in-memory), further navigation in a loop happens client-side, so
      accessing related entities per item triggers separate DB round-trips instead of one SQL query.
    back_es: Una vez que estás en IEnumerable (en memoria), navegar más en un loop pasa del lado del cliente,
      así que acceder a entidades relacionadas por elemento dispara viajes separados a la base en vez
      de una sola query.
  standard_minutes: 35
