  cards:
  - id: w13-scale-s3-c1
    front: What does 'at-least-once delivery' mean for a message queue like RabbitMQ?
    front_es: ¿Qué significa 'entrega al menos una vez' para una cola de mensajes como RabbitMQ?
    back: The queue guarantees a message will be delivered at least once, but might deliver the same message
      more than once (e.g. after a redelivery due to an unacknowledged message).
    back_es: La cola garantiza que un mensaje se entregará al menos una vez, pero puede entregar el mismo
      mensaje más de una vez (ej. después de una redelivery por un mensaje sin ack).
  - id: w13-scale-s3-c2
    front: Why must a queue consumer's handler be idempotent?
    front_es: ¿Por qué el handler de un consumidor de cola debe ser idempotente?
    back: Because of at-least-once delivery, the same message can be processed twice; an idempotent handler
      produces the same result either way instead of double-applying the effect.
    back_es: Por la entrega al menos una vez, el mismo mensaje se puede procesar dos veces; un handler
      idempotente produce el mismo resultado sin importar cuántas veces se ejecute, en vez de aplicar
      el efecto doble.
  standard_minutes: 35
