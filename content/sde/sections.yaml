    front: What should a good pull request description focus reviewers on?
    front_es: ¿En qué debería enfocar a los reviewers una buena descripción de PR?
    back: The behavior change, the tests that prove it, and the scope/cut of the change — not incidental
      noise.
    back_es: El cambio de comportamiento, los tests que lo prueban, y el alcance/corte del cambio — no
      el ruido incidental.
  - id: w04-git-s2-c2
    front: Why is a PR with 40 unrelated formatting-only file changes a problem?
    front_es: ¿Por qué es un problema un PR con 40 cambios de formato sin relación?
    back: It buries the real change in noise, makes review harder, and increases the chance of an unrelated
      regression slipping through unreviewed.
    back_es: Esconde el cambio real entre ruido, hace el review más difícil, y aumenta el riesgo de que
      una regresión sin relación pase sin revisarse.
