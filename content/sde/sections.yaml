    front: How does looping over a navigation property inside a foreach cause N+1 queries in EF?
    front_es: ¿Cómo un loop sobre una navigation property dentro de un foreach causa N+1 queries en EF?
    back: If the navigation is lazy-loaded, accessing it for each of N parent rows triggers a separate
      query per row instead of one batched query.
    back_es: Si la navegación es lazy-loaded, acceder a ella por cada una de N filas dispara una query
      separada por fila en vez de una sola query agrupada.
  - id: w09-linq-s4-c2
    front: What are the two standard fixes for N+1 in EF/LINQ?
    front_es: ¿Cuáles son las dos soluciones estándar al N+1 en EF/LINQ?
    back: Use .Include() to eager-load the related data in the original query, or use .Select() to project
      exactly the fields you need in a single query.
    back_es: Usar .Include() para cargar de forma eager los datos relacionados en la query original, o
      usar .Select() para proyectar exactamente los campos que necesitas en una sola query.
