    front: How do you decide whether an EF Core query should use tracking or AsNoTracking?
    front_es: ¿Cómo decides si una query de EF Core debería usar tracking o AsNoTracking?
    back: If you're going to modify and save the entity, use tracking (the default). If it's purely for
      display/read-only purposes, use AsNoTracking to skip the tracking overhead.
    back_es: Si vas a modificar y guardar la entidad, usa tracking (el default). Si es puramente para
      mostrar/solo lectura, usa AsNoTracking para saltarte el costo del tracking.
