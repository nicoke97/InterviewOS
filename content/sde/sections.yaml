  cards:
  - id: w14-gc-asyncio-s3-c1
    front: How does Python's asyncio event loop work, at a high level?
    front_es: ¿Cómo funciona el event loop de asyncio en Python, a alto nivel?
    back: A single thread runs one event loop that schedules coroutines; when a coroutine awaits I/O,
      it yields control back to the loop, which runs other ready coroutines until the I/O completes.
    back_es: Un solo thread corre un event loop que agenda corrutinas; cuando una corrutina hace await
      sobre I/O, le devuelve el control al loop, que corre otras corrutinas listas hasta que el I/O termina.
  - id: w14-gc-asyncio-s3-c2
    front: Does asyncio give you true parallelism on multiple CPU cores?
    front_es: ¿asyncio te da paralelismo real en varios cores de CPU?
    back: No — it's concurrency on a single thread (great for I/O-bound work), not parallelism. CPU-bound
      work needs multiprocessing instead.
    back_es: No — es concurrencia en un solo thread (genial para trabajo I/O-bound), no paralelismo. El
      trabajo CPU-bound necesita multiprocessing en su lugar.
  standard_minutes: 35
