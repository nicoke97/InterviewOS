  cards:
  - id: w14-gc-asyncio-s1-c1
    front: What are Gen 0, 1, and 2 in the .NET garbage collector?
    front_es: ¿Qué son las Gen 0, 1 y 2 en el garbage collector de .NET?
    back: 'Generations based on object lifetime: Gen 0 holds short-lived objects and is collected most
      often/cheaply; Gen 1 buffers between short and long-lived; Gen 2 holds long-lived objects and is
      collected least often, at higher cost.'
    back_es: 'Generaciones según la vida del objeto: Gen 0 tiene objetos de vida corta y se recolecta
      más seguido/barato; Gen 1 es el buffer entre corta y larga vida; Gen 2 tiene objetos de vida larga
      y se recolecta menos seguido, con más costo.'
  - id: w14-gc-asyncio-s1-c2
    front: Why doesn't the GC alone clean up things like open sockets or file handles?
    front_es: ¿Por qué el GC solo no limpia cosas como sockets abiertos o file handles?
    back: The GC only manages managed memory; unmanaged resources (sockets, file handles, DB connections)
      need explicit cleanup via IDisposable/Dispose() (typically through a using block), since the GC
      doesn't know when it's safe or timely to release them.
    back_es: El GC solo maneja memoria administrada; los recursos no administrados (sockets, file handles,
      conexiones de DB) necesitan limpieza explícita vía IDisposable/Dispose() (normalmente con un using),
      porque el GC no sabe cuándo es seguro u oportuno liberarlos.
  standard_minutes: 35
