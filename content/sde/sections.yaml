  cards:
  - id: w10-ef-s4-c1
    front: What does DbContext.SaveChanges() do?
    front_es: ¿Qué hace DbContext.SaveChanges()?
    back: It looks at everything the change tracker recorded (added, modified, deleted entities) and writes
      all of it to the database in a single transaction.
    back_es: Revisa todo lo que el change tracker registró (entidades agregadas, modificadas, eliminadas)
      y escribe todo a la base en una sola transacción.
  - id: w10-ef-s4-c2
    front: If one of several changes in SaveChanges() fails, what happens to the rest?
    front_es: Si uno de varios cambios en SaveChanges() falla, ¿qué pasa con el resto?
    back: The whole call is one transaction, so if any part fails, the entire batch rolls back — nothing
      partial gets committed.
    back_es: Toda la llamada es una sola transacción, así que si una parte falla, todo el lote hace rollback
      — nada parcial queda commiteado.
