  - id: w02-rest-s2-c1
    front: What does it mean for an HTTP method to be idempotent?
    front_es: ¿Qué significa que un método HTTP sea idempotente?
    back: Calling it multiple times with the same input has the same effect on server state as calling
      it once — no extra side effects on repeat.
    back_es: Llamarlo varias veces con el mismo input tiene el mismo efecto en el estado del servidor
      que llamarlo una sola vez — sin efectos extra al repetir.
  - id: w02-rest-s2-c2
    front: Per RFC 9110, which standard HTTP methods are idempotent, and which is not?
    front_es: Según RFC 9110, ¿cuáles métodos HTTP estándar son idempotentes, y cuál no?
    back: GET, HEAD, OPTIONS, TRACE, PUT, and DELETE are idempotent. POST is not — calling POST /orders
      twice can create two orders.
    back_es: GET, HEAD, OPTIONS, TRACE, PUT y DELETE son idempotentes. POST no lo es — llamar POST /orders
      dos veces puede crear dos órdenes.
  - id: w02-rest-s2-c3
    front: Why does idempotency matter for retries in distributed systems?
    front_es: ¿Por qué importa la idempotencia para los retries en sistemas distribuidos?
    back: A network failure makes it unclear whether a request actually succeeded; if the operation is
      idempotent, you can safely retry it without risking duplicate side effects (like double-charging).
    back_es: Una falla de red no te dice si el request de verdad tuvo éxito; si la operación es idempotente,
      puedes reintentarla sin riesgo de efectos duplicados (como cobrar dos veces).
  - id: w02-rest-s2-c4
    front: How do you make a non-idempotent operation like 'create order' safe to retry?
    front_es: ¿Cómo haces que una operación no idempotente como 'crear orden' sea segura de reintentar?
    back: 'Use an idempotency key: a client-generated request ID the server stores, so it can detect and
      ignore duplicate submissions of the same logical request.'
    back_es: 'Usando una idempotency key: un ID de request generado por el cliente que el servidor guarda,
      para detectar e ignorar envíos duplicados del mismo request lógico.'
