    front: Why is a synchronous (blocking) HTTP call considered wasteful on a server?
    front_es: ¿Por qué una llamada HTTP síncrona (bloqueante) es un desperdicio en un servidor?
    back: The thread sits idle waiting on the network instead of doing other work; under load this exhausts
      the thread pool and limits throughput, which async I/O avoids.
    back_es: El thread se queda inactivo esperando la red en vez de hacer otra cosa; bajo carga esto agota
      el thread pool y limita el throughput, lo cual el I/O async evita.
