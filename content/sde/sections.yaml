  cards:
  - id: w15-gil-py-s2-c1
    front: In Python, when would you reach for threading vs multiprocessing vs asyncio?
    front_es: En Python, ¿cuándo usarías threading vs multiprocessing vs asyncio?
    back: threading for I/O-bound blocking calls (the GIL is released during I/O waits); multiprocessing
      for CPU-bound work needing real parallelism across cores (separate processes, separate GILs); asyncio
      for a large number of concurrent I/O-bound tasks on a single thread.
    back_es: threading para llamadas bloqueantes I/O-bound (el GIL se libera durante la espera de I/O);
      multiprocessing para trabajo CPU-bound que necesita paralelismo real entre cores (procesos separados,
      GIL separado cada uno); asyncio para muchas tareas concurrentes I/O-bound en un solo thread.
