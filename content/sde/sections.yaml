    front: What are EF Core migrations?
    front_es: ¿Qué son las migrations de EF Core?
    back: Versioned, code-based scripts describing incremental changes to the database schema, generated
      from changes to your entity model, and applied in order.
    back_es: Scripts versionados, basados en código, que describen cambios incrementales al schema de
      la base, generados a partir de cambios en tu modelo de entidades, y aplicados en orden.
  - id: w10-ef-s1-c2
    front: Why is manually editing a production database schema a bad practice?
    front_es: ¿Por qué es mala práctica editar a mano el schema de la base en producción?
    back: It's undocumented, unrepeatable, and untracked — it breaks the migration history, making the
      schema diverge from what migrations expect and hard to reproduce elsewhere.
    back_es: No queda documentado, no es repetible ni rastreado — rompe el historial de migrations, haciendo
      que el schema se desalinee de lo que las migrations esperan y sea difícil de reproducir en otro
      lado.
