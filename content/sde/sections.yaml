    front: What's the difference between a log and a trace in observability?
    front_es: ¿Cuál es la diferencia entre un log y un trace en observabilidad?
    back: A log is a discrete event/message at a point in time. A trace follows a single request's path
      across multiple services/components, showing timing and causality between steps.
    back_es: Un log es un evento/mensaje discreto en un punto en el tiempo. Un trace sigue el camino de
      un solo request a través de varios servicios/componentes, mostrando tiempos y causalidad entre pasos.
  - id: w13-scale-s4-c2
    front: How does dual-running two implementations (like eLink's SOAP+REST) give you observability?
    front_es: ¿Cómo el dual-run de dos implementaciones (como SOAP+REST de eLink) te da observabilidad?
    back: By diffing the outputs of both paths for the same input, you get direct evidence of behavioral
      differences/regressions, instead of just hoping logs would reveal a discrepancy.
    back_es: Comparando las salidas de ambos paths para el mismo input, tienes evidencia directa de diferencias/regresiones
      de comportamiento, en vez de solo esperar que los logs revelen una discrepancia.
  standard_minutes: 35
