sections:
- id: w00-fundamentos-s1
  week_id: w00-fundamentos
  week_title: Programming foundations
  week_title_es: Fundamentos
  anchor: ''
  anchor_es: ''
  title: What is OOP
  title_es: Qué es POO
  reading: Object-oriented programming (OOP) structures a program around objects. An object holds data
    (state) and the operations that use that data (behavior). A class is the definition; an object is
    one instance of that class in memory. You use OOP so related data and rules live together, instead
    of a pile of loose functions and global variables.
  reading_es: La programación orientada a objetos (POO) organiza el programa alrededor de objetos. Un
    objeto guarda datos (estado) y las operaciones que usan esos datos (comportamiento). La clase es la
    definición; el objeto es una instancia de esa clase en memoria. Sirve para que datos y reglas vivan
    juntos, no en un montón de funciones sueltas y variables globales.
  reading_en: Object-oriented programming (OOP) structures a program around objects. An object holds data
    (state) and the operations that use that data (behavior). A class is the definition; an object is
    one instance of that class in memory. You use OOP so related data and rules live together, instead
    of a pile of loose functions and global variables.
  questions:
  - id: w00-fundamentos-s1-q1
    q: What is object-oriented programming?
    q_es: ¿Qué es la programación orientada a objetos?
    choices:
    - A way to structure a program around objects that combine state and behavior
    - A database engine
    - A C# keyword
    - The four HTTP verbs
    choices_es:
    - Una forma de organizar el programa alrededor de objetos que juntan estado y comportamiento
    - Un motor de base de datos
    - Una palabra clave de C#
    - Los cuatro verbos HTTP
    answer: 0
  - id: w00-fundamentos-s1-q2
    q: What is the difference between a class and an object?
    q_es: ¿Cuál es la diferencia entre una clase y un objeto?
    choices:
    - The class is the definition; the object is one instance in memory
    - They are the same thing
    - The object is the file; the class is the database row
    - A class is Python; an object is C#
    choices_es:
    - La clase es la definición; el objeto es una instancia en memoria
    - Son lo mismo
    - El objeto es el archivo; la clase es la fila de la base
    - Clase es Python; objeto es C#
    answer: 0
  - id: w00-fundamentos-s1-q3
    q: What does an object hold?
    q_es: ¿Qué guarda un objeto?
    choices:
    - State (data) and behavior (methods)
    - Only SQL queries
    - Only the class name
    - HTTP status codes
    choices_es:
    - Estado (datos) y comportamiento (métodos)
    - Solo queries SQL
    - Solo el nombre de la clase
    - Status codes HTTP
    answer: 0
  - id: w00-fundamentos-s1-q4
    q: Why use OOP instead of only loose functions?
    q_es: ¿Para qué usar POO en vez de solo funciones sueltas?
    choices:
    - So related data and the rules that change it live in one place
    - Because interviews require the word Codenda
    - Because functions are illegal in C#
    - To avoid writing any types
    choices_es:
    - Para que los datos relacionados y las reglas que los cambian vivan en un solo lugar
    - Porque en entrevista hay que decir Codenda
    - Porque las funciones son ilegales en C#
    - Para no escribir tipos
    answer: 0
  cards:
  - id: w00-fundamentos-s1-c1
    front: What is OOP?
    front_es: ¿Qué es POO?
    back: A way to structure a program around objects that combine data (state) and operations (behavior).
    back_es: Una forma de organizar el programa alrededor de objetos que juntan datos (estado) y operaciones
      (comportamiento).
  - id: w00-fundamentos-s1-c2
    front: Class vs object?
    front_es: ¿Clase vs objeto?
    back: 'The class is the blueprint. The object is one living instance: var c = new Cuenta(100);'
    back_es: 'La clase es el plano. El objeto es una instancia viva: var c = new Cuenta(100);'
  - id: w00-fundamentos-s1-c3
    front: What is state vs behavior?
    front_es: ¿Qué es estado vs comportamiento?
    back: State is the data the object keeps (Saldo). Behavior is the methods that use it (Deposita).
    back_es: Estado es el dato que guarda el objeto (Saldo). Comportamiento son los métodos que lo usan
      (Deposita).
  - id: w00-fundamentos-s1-c4
    front: Why OOP?
    front_es: ¿Para qué sirve POO?
    back: Keep related data and rules together, instead of loose functions plus global variables.
    back_es: Juntar datos y reglas relacionados, en vez de funciones sueltas y variables globales.
  standard_minutes: 35
  index: 0
- id: w00-fundamentos-s2
  week_id: w00-fundamentos
  week_title: Programming foundations
  week_title_es: Fundamentos
  anchor: ''
  anchor_es: ''
  title: The four pillars
  title_es: Los 4 pilares
  reading: The four pillars of OOP are encapsulation, abstraction, inheritance, and polymorphism. Encapsulation
    hides internal data and exposes a controlled interface (private fields, public methods). Abstraction
    shows only what matters and hides the messy details behind a name. Inheritance lets a class reuse
    and extend another (Square is a Shape). Polymorphism means the same message can run different code
    (shape.Area() is the square version or the circle version).
  reading_es: 'Los cuatro pilares de POO son encapsulación, abstracción, herencia y polimorfismo. Encapsulación:
    escondes los datos internos y expones una interfaz controlada (campos private, métodos public). Abstracción:
    muestras solo lo que importa y escondes el detalle detrás de un nombre. Herencia: una clase reutiliza
    y extiende otra (Cuadrado es una Forma). Polimorfismo: el mismo mensaje ejecuta código distinto (forma.Area()
    corre la versión del cuadrado o del círculo).'
  reading_en: The four pillars of OOP are encapsulation, abstraction, inheritance, and polymorphism. Encapsulation
    hides internal data and exposes a controlled interface (private fields, public methods). Abstraction
    shows only what matters and hides the messy details behind a name. Inheritance lets a class reuse
    and extend another (Square is a Shape). Polymorphism means the same message can run different code
    (shape.Area() is the square version or the circle version).
  questions:
  - id: w00-fundamentos-s2-q1
    q: What are the four pillars of OOP?
    q_es: ¿Cuáles son los 4 pilares de POO?
    choices:
    - Encapsulation, abstraction, inheritance, polymorphism
    - Class, object, method, Codenda
    - GET, POST, PUT, DELETE
    - Transient, scoped, singleton, static
    choices_es:
    - Encapsulación, abstracción, herencia, polimorfismo
    - Clase, objeto, método, Codenda
    - GET, POST, PUT, DELETE
    - Transient, scoped, singleton, static
    answer: 0
  - id: w00-fundamentos-s2-q2
    q: What is encapsulation?
    q_es: ¿Qué es encapsulación?
    choices:
    - Hide internal data; change it only through a controlled interface (private + public methods).
    - Make every field public.
    - Copy methods from a parent class.
    - Run two writers at the same time.
    choices_es:
    - Esconder los datos internos; cambiarlos solo por una interfaz controlada (private + métodos public).
    - Hacer public todos los campos.
    - Copiar métodos de la clase padre.
    - Correr dos writers al mismo tiempo.
    answer: 0
  - id: w00-fundamentos-s2-q3
    q: What is polymorphism?
    q_es: ¿Qué es polimorfismo?
    choices:
    - The same call (Area()) runs different code depending on the real type
    - A class with no methods
    - Importing a namespace
    - Mapping a class to a SQL table
    choices_es:
    - La misma llamada (Area()) corre código distinto según el tipo real
    - Una clase sin métodos
    - Importar un namespace
    - Mapear una clase a una tabla SQL
    answer: 0
  - id: w00-fundamentos-s2-q4
    q: What is inheritance?
    q_es: ¿Qué es herencia?
    choices:
    - 'A class reuses and extends another: Square : Shape'
    - Hiding all fields with private
    - A function that is not on a class
    - An ORM transaction
    choices_es:
    - 'Una clase reutiliza y extiende otra: Square : Shape'
    - Esconder todos los campos con private
    - Una función que no está en una clase
    - Una transacción del ORM
    answer: 0
  cards:
  - id: w00-fundamentos-s2-c1
    front: What are the 4 pillars of OOP?
    front_es: ¿Cuáles son los 4 pilares de POO?
    back: Encapsulation, abstraction, inheritance, polymorphism.
    back_es: Encapsulación, abstracción, herencia, polimorfismo.
  - id: w00-fundamentos-s2-c2
    front: What is encapsulation?
    front_es: ¿Qué es encapsulación?
    back: 'Hide internal data. Expose a controlled interface: private fields, public methods.'
    back_es: 'Esconder los datos internos. Exponer una interfaz controlada: campos private, métodos public.'
  - id: w00-fundamentos-s2-c3
    front: What is abstraction?
    front_es: ¿Qué es abstracción?
    back: 'Show only what matters. Hide the messy details behind a name: client.Sync(), not 40 SOAP calls.'
    back_es: 'Mostrar solo lo que importa. Esconder el detalle detrás de un nombre: client.Sync(), no
      40 llamadas SOAP.'
  - id: w00-fundamentos-s2-c4
    front: What is inheritance?
    front_es: ¿Qué es herencia?
    back: 'A class reuses and extends another. Square is a Shape (class Square : Shape).'
    back_es: 'Una clase reutiliza y extiende otra. Cuadrado es una Forma (class Square : Shape).'
  - id: w00-fundamentos-s2-c5
    front: What is polymorphism?
    front_es: ¿Qué es polimorfismo?
    back: Same message, different code. shape.Area() runs the square or circle implementation.
    back_es: Mismo mensaje, código distinto. forma.Area() corre la implementación del cuadrado o del círculo.
  standard_minutes: 35
  index: 1
- id: w00-fundamentos-s3
  week_id: w00-fundamentos
  week_title: Programming foundations
  week_title_es: Fundamentos
  anchor: ''
  anchor_es: ''
  title: Class, object, method, function
  title_es: Clase, objeto, método, función
  reading: 'A class declares fields, properties, methods, and a constructor. An object (instance) is created
    with new. A function is a named block of code with inputs and a result; in Python it can live at module
    level, in C# it is usually a static method. A method is a function that belongs to a class or object
    and can use its state: cuenta.Deposita(50). The constructor (Cuenta(int saldo)) runs on new and sets
    the initial state. public/private control who can see members. An interface is a contract of methods
    with no implementation (or default implementations); a class implements it.'
  reading_es: 'Una clase declara campos, propiedades, métodos y un constructor. Un objeto (instancia)
    se crea con new. Una función es un bloque con nombre, entradas y un resultado; en Python puede vivir
    suelta en el módulo, en C# casi siempre es un método static. Un método es una función que pertenece
    a una clase u objeto y puede usar su estado: cuenta.Deposita(50). El constructor (Cuenta(int saldo))
    corre al hacer new y deja el estado inicial. public/private controlan quién ve los miembros. Una interfaz
    es un contrato de métodos sin implementación (o con defaults); una clase la implementa.'
  reading_en: 'A class declares fields, properties, methods, and a constructor. An object (instance) is
    created with new. A function is a named block of code with inputs and a result; in Python it can live
    at module level, in C# it is usually a static method. A method is a function that belongs to a class
    or object and can use its state: cuenta.Deposita(50). The constructor (Cuenta(int saldo)) runs on
    new and sets the initial state. public/private control who can see members. An interface is a contract
    of methods with no implementation (or default implementations); a class implements it.'
  questions:
  - id: w00-fundamentos-s3-q1
    q: What is a class?
    q_es: ¿Qué es una clase?
    choices:
    - 'The definition of a type: fields, properties, methods, constructor'
    - One row in SQL Server
    - A using statement
    - An HTTP request
    choices_es:
    - 'La definición de un tipo: campos, propiedades, métodos, constructor'
    - Una fila de SQL Server
    - Un using
    - Una request HTTP
    answer: 0
  - id: w00-fundamentos-s3-q2
    q: What is a method vs a function?
    q_es: ¿Método vs función?
    choices:
    - A method belongs to a class/object and can use its state; a function is a named block that does
      not need an instance
    - A method is Python; a function is C#
    - They are identical in every language
    - A function is only SQL
    choices_es:
    - El método pertenece a una clase/objeto y puede usar su estado; la función es un bloque con nombre
      que no necesita instancia
    - Método es Python; función es C#
    - Son idénticos en todos los lenguajes
    - Función es solo SQL
    answer: 0
  - id: w00-fundamentos-s3-q3
    q: What does a constructor do?
    q_es: ¿Qué hace un constructor?
    choices:
    - Runs when you new the object and sets initial state
    - Deletes the object from the database
    - Imports a namespace
    - Starts the HTTP pipeline
    choices_es:
    - Corre cuando haces new y deja el estado inicial
    - Borra el objeto de la base
    - Importa un namespace
    - Arranca el pipeline HTTP
    answer: 0
  - id: w00-fundamentos-s3-q4
    q: What is an interface?
    q_es: ¿Qué es una interfaz?
    choices:
    - A contract of methods a class must implement
    - A SQL table
    - A private field
    - The C# garbage collector
    choices_es:
    - Un contrato de métodos que una clase debe implementar
    - Una tabla SQL
    - Un campo private
    - El garbage collector de C#
    answer: 0
  cards:
  - id: w00-fundamentos-s3-c1
    front: What is a class?
    front_es: ¿Qué es una clase?
    back: 'The definition of a type: fields, properties, methods, constructor.'
    back_es: 'La definición de un tipo: campos, propiedades, métodos, constructor.'
  - id: w00-fundamentos-s3-c2
    front: What is an object / instance?
    front_es: ¿Qué es un objeto / instancia?
    back: 'One living copy of a class in memory: var c = new Cuenta(100);'
    back_es: 'Una copia viva de la clase en memoria: var c = new Cuenta(100);'
  - id: w00-fundamentos-s3-c3
    front: What is a function?
    front_es: ¿Qué es una función?
    back: A named block of code with inputs and a result. In Python it can be free; in C# it is usually
      static.
    back_es: Un bloque con nombre, entradas y un resultado. En Python puede ir suelta; en C# casi siempre
      es static.
  - id: w00-fundamentos-s3-c4
    front: What is a method?
    front_es: ¿Qué es un método?
    back: 'A function that belongs to a class or object and can use its state: cuenta.Deposita(50).'
    back_es: 'Una función que pertenece a una clase u objeto y puede usar su estado: cuenta.Deposita(50).'
  - id: w00-fundamentos-s3-c5
    front: What is a constructor?
    front_es: ¿Qué es un constructor?
    back: 'The method that runs on new and sets initial state: Cuenta(int saldo).'
    back_es: 'El método que corre en el new y deja el estado inicial: Cuenta(int saldo).'
  - id: w00-fundamentos-s3-c6
    front: What is an interface?
    front_es: ¿Qué es una interfaz?
    back: 'A contract: methods a class must implement. The class provides the body.'
    back_es: 'Un contrato: métodos que una clase debe implementar. La clase pone el cuerpo.'
  - id: w00-fundamentos-s3-c7
    front: What do public and private do?
    front_es: ¿Qué hacen public y private?
    back: 'public: callers can see it. private: only the class itself. That is encapsulation in syntax.'
    back_es: 'public: los demás lo ven. private: solo la clase. Eso es encapsulación en sintaxis.'
  standard_minutes: 35
  index: 2
- id: w00-fundamentos-s4
  week_id: w00-fundamentos
  week_title: Programming foundations
  week_title_es: Fundamentos
  anchor: ''
  anchor_es: ''
  title: using and namespace
  title_es: using y namespace
  reading: 'In C#, using has two meanings. using System.Text; imports a namespace so you can write StringBuilder
    instead of System.Text.StringBuilder. using (var conn = new SqlConnection(...)) { } creates an IDisposable
    and guarantees Dispose() runs when the block ends — the connection closes even if the code throws.
    Modern form: using var conn = new SqlConnection(...); A namespace groups types. using is not a class
    and not ''the OOP keyword''. Namespace using is like Python import / Java import. Disposable using
    is like Python with.'
  reading_es: 'En C#, using significa dos cosas distintas. using System.Text; importa un namespace para
    escribir StringBuilder en vez de System.Text.StringBuilder. using (var conn = new SqlConnection(...))
    { } crea un IDisposable y garantiza Dispose() al salir del bloque — la conexión se cierra aunque truene.
    Forma moderna: using var conn = new SqlConnection(...); Un namespace agrupa tipos. using no es una
    clase ni ''la palabra de POO''. El using de namespace es como import en Python o Java. El using de
    Dispose es como with en Python.'
  reading_en: 'In C#, using has two meanings. using System.Text; imports a namespace so you can write
    StringBuilder instead of System.Text.StringBuilder. using (var conn = new SqlConnection(...)) { }
    creates an IDisposable and guarantees Dispose() runs when the block ends — the connection closes even
    if the code throws. Modern form: using var conn = new SqlConnection(...); A namespace groups types.
    using is not a class and not ''the OOP keyword''. Namespace using is like Python import / Java import.
    Disposable using is like Python with.'
  questions:
  - id: w00-fundamentos-s4-q1
    q: What does using System.Linq; do?
    q_es: ¿Qué hace using System.Linq;?
    choices:
    - Imports a namespace so you can use its types without the full path
    - Opens a SQL connection
    - Creates a class
    - Starts a transaction
    choices_es:
    - Importa un namespace para usar sus tipos sin el path completo
    - Abre una conexión SQL
    - Crea una clase
    - Arranca una transacción
    answer: 0
  - id: w00-fundamentos-s4-q2
    q: What does using (var conn = new SqlConnection(...)) do?
    q_es: ¿Qué hace using (var conn = new SqlConnection(...))?
    choices:
    - Creates an IDisposable and always calls Dispose() when the block ends
    - Imports the SqlConnection namespace
    - Makes conn public
    - Maps conn to a table
    choices_es:
    - Crea un IDisposable y siempre llama Dispose() al terminar el bloque
    - Importa el namespace de SqlConnection
    - Hace public a conn
    - Mapea conn a una tabla
    answer: 0
  - id: w00-fundamentos-s4-q3
    q: What is a namespace?
    q_es: ¿Qué es un namespace?
    choices:
    - A name prefix that groups types and avoids collisions
    - A running object in memory
    - An ORM
    - A private field
    choices_es:
    - Un prefijo que agrupa tipos y evita choques de nombres
    - Un objeto vivo en memoria
    - Un ORM
    - Un campo private
    answer: 0
  - id: w00-fundamentos-s4-q4
    q: Python with is the same idea as which C# using?
    q_es: ¿El with de Python es la misma idea que cuál using de C#?
    choices:
    - The IDisposable using that calls Dispose
    - The namespace import using
    - Neither
    - The class keyword
    choices_es:
    - El using de IDisposable que llama Dispose
    - El using que importa un namespace
    - Ninguno
    - La palabra class
    answer: 0
  cards:
  - id: w00-fundamentos-s4-c1
    front: What does using System.Text; do?
    front_es: ¿Qué hace using System.Text;?
    back: Imports a namespace. You write StringBuilder instead of System.Text.StringBuilder.
    back_es: Importa un namespace. Escribes StringBuilder en vez de System.Text.StringBuilder.
  - id: w00-fundamentos-s4-c2
    front: What does using (var x = ...) { } do?
    front_es: ¿Qué hace using (var x = ...) { }?
    back: Creates an IDisposable and always calls Dispose() at the end of the block, even on throw.
    back_es: Crea un IDisposable y siempre llama Dispose() al salir del bloque, aunque truene.
  - id: w00-fundamentos-s4-c3
    front: What is the modern form of disposable using?
    front_es: ¿Cuál es la forma moderna del using que hace Dispose?
    back: using var conn = new SqlConnection(...); Dispose still runs at the end of the scope.
    back_es: using var conn = new SqlConnection(...); Dispose igual corre al terminar el scope.
  - id: w00-fundamentos-s4-c4
    front: What is a namespace?
    front_es: ¿Qué es un namespace?
    back: A name prefix that groups types (System.Text, MiApp.Ordenes) so names do not collide.
    back_es: Un prefijo que agrupa tipos (System.Text, MiApp.Ordenes) para que no choquen los nombres.
  - id: w00-fundamentos-s4-c5
    front: Is using a class?
    front_es: ¿using es una clase?
    back: No. It is a directive (import) or a statement (Dispose). Not an OOP pillar.
    back_es: No. Es una directiva (import) o una sentencia (Dispose). No es un pilar de POO.
  - id: w00-fundamentos-s4-c6
    front: Python with ≈ which C# using?
    front_es: ¿with de Python ≈ cuál using de C#?
    back: The IDisposable using. The other using is just import.
    back_es: El using de IDisposable. El otro using es solo import.
  standard_minutes: 35
  index: 3
- id: w00-fundamentos-s5
  week_id: w00-fundamentos
  week_title: Programming foundations
  week_title_es: Fundamentos
  anchor: ''
  anchor_es: ''
  title: What is EF
  title_es: Qué es EF
  reading: 'Entity Framework (EF / EF Core) is an ORM: Object-Relational Mapper. It maps C# classes to
    database tables so you can query with LINQ instead of writing every SQL string by hand. DbContext
    is the unit of work. DbSet<T> is a table. SaveChanges() writes the tracked inserts, updates, and deletes.
    EF is not the database and not SQL — it talks to the database for you. You can still write SQL when
    you need to. Later weeks cover tracking, N+1, and migrations; this section is only what EF is.'
  reading_es: 'Entity Framework (EF / EF Core) es un ORM: Object-Relational Mapper. Mapea clases de C#
    a tablas de la base para consultar con LINQ en vez de escribir cada SQL a mano. DbContext es la unidad
    de trabajo. DbSet<T> es una tabla. SaveChanges() escribe los insert/update/delete que tenía rastreados.
    EF no es la base ni es SQL — habla con la base por ti. Igual puedes escribir SQL cuando hace falta.
    Semanas después cubren tracking, N+1 y migrations; aquí solo qué es EF.'
  reading_en: 'Entity Framework (EF / EF Core) is an ORM: Object-Relational Mapper. It maps C# classes
    to database tables so you can query with LINQ instead of writing every SQL string by hand. DbContext
    is the unit of work. DbSet<T> is a table. SaveChanges() writes the tracked inserts, updates, and deletes.
    EF is not the database and not SQL — it talks to the database for you. You can still write SQL when
    you need to. Later weeks cover tracking, N+1, and migrations; this section is only what EF is.'
  questions:
  - id: w00-fundamentos-s5-q1
    q: What is Entity Framework?
    q_es: ¿Qué es Entity Framework?
    choices:
    - 'An ORM: it maps C# classes to database tables'
    - The C# compiler
    - A JavaScript framework
    - A Git host
    choices_es:
    - 'Un ORM: mapea clases de C# a tablas de la base'
    - El compilador de C#
    - Un framework de JavaScript
    - Un host de Git
    answer: 0
  - id: w00-fundamentos-s5-q2
    q: What does ORM mean?
    q_es: ¿Qué significa ORM?
    choices:
    - Object-Relational Mapper — objects on one side, relational tables on the other
    - Only Raw MySQL
    - Object Runtime Memory
    - Open REST Method
    choices_es:
    - Object-Relational Mapper — objetos de un lado, tablas relacionales del otro
    - Only Raw MySQL
    - Object Runtime Memory
    - Open REST Method
    answer: 0
  - id: w00-fundamentos-s5-q3
    q: What is DbContext?
    q_es: ¿Qué es DbContext?
    choices:
    - 'The unit of work: sets plus a change tracker; SaveChanges writes the batch'
    - A single SQL table
    - A namespace import
    - The ASP.NET pipeline
    choices_es:
    - 'La unidad de trabajo: los sets más el change tracker; SaveChanges escribe el lote'
    - Una sola tabla SQL
    - Un import de namespace
    - El pipeline de ASP.NET
    answer: 0
  - id: w00-fundamentos-s5-q4
    q: Is EF the database?
    q_es: ¿EF es la base de datos?
