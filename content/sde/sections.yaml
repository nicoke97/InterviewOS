    front: What's the difference between offset-based and cursor-based pagination?
    front_es: ¿Cuál es la diferencia entre paginación por offset y por cursor?
    back: Offset (LIMIT/OFFSET) skips N rows and is simple, but can skip or duplicate rows if data changes
      between page loads. Cursor pagination uses a pointer (last seen id/timestamp) to fetch the next
      page, staying consistent even as rows are inserted.
    back_es: Offset (LIMIT/OFFSET) salta N filas y es simple, pero puede saltarse o duplicar filas si
      los datos cambian entre páginas. La paginación por cursor usa un puntero (último id/timestamp visto)
      para la siguiente página, y se mantiene consistente aunque se inserten filas.
  - id: w02-rest-s3-c2
    front: Why does offset pagination break when rows are inserted between page loads?
    front_es: ¿Por qué se rompe la paginación por offset si insertan filas entre páginas?
    back: OFFSET counts rows from the start every time; a new row inserted before the current offset shifts
      everything, causing duplicates or missed rows on the next page.
    back_es: OFFSET cuenta filas desde el inicio cada vez; una fila nueva insertada antes del offset actual
      recorre todo, causando duplicados o filas que se saltan en la siguiente página.
  - id: w02-rest-s3-c3
    front: When would you prefer cursor-based pagination over offset?
    front_es: ¿Cuándo preferirías paginación por cursor en vez de offset?
    back: For large, frequently-changing datasets (e.g. live order or listing feeds) where consistency
      across pages matters more than jumping to an arbitrary page number.
    back_es: Para datasets grandes que cambian seguido (ej. feeds de orders o listings en vivo) donde
      la consistencia entre páginas importa más que poder saltar a una página arbitraria.
