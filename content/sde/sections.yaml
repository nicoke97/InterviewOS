    front: What is the Strategy pattern?
    front_es: ¿Qué es el patrón Strategy?
    back: It defines a family of interchangeable algorithms/behaviors behind a common interface, so you
      can swap which one runs at runtime without changing the caller.
    back_es: Define una familia de algoritmos/comportamientos intercambiables detrás de una interfaz común,
      así puedes cambiar cuál corre en tiempo de ejecución sin tocar a quien llama.
  - id: w12-solid-s4-c2
    front: How is eLink's dual-run (SOAP writer vs REST writer) an example of the Strategy pattern?
    front_es: ¿Cómo el dual-run de eLink (writer SOAP vs writer REST) es un ejemplo del patrón Strategy?
    back: Both writers implement the same interface; which concrete strategy actually performs the write
      can be swapped (or run side-by-side) without changing the calling code.
    back_es: Ambos writers implementan la misma interfaz; cuál estrategia concreta hace el write de verdad
      se puede cambiar (o correr en paralelo) sin tocar el código que llama.
  - id: w12-solid-s4-c3
    front: What is the Decorator pattern?
    front_es: ¿Qué es el patrón Decorator?
    back: It wraps an object to add behavior (logging, caching, retries) transparently, without changing
      the wrapped object's code or interface.
    back_es: Envuelve un objeto para agregar comportamiento (logging, cache, retries) de forma transparente,
      sin cambiar el código o la interfaz del objeto envuelto.
