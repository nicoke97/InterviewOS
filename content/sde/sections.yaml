  - id: w03-sql-s3-c1
    front: What's the core idea of database normalization (1NF–3NF)?
    front_es: ¿Cuál es la idea central de la normalización de bases de datos (1NF–3NF)?
    back: 'Each fact lives in exactly one place, avoiding duplication and inconsistency. Roughly: 1NF
      = atomic columns, no repeating groups; 2NF = no partial dependency on part of a composite key; 3NF
      = no transitive dependency on non-key columns.'
    back_es: 'Cada dato vive en un solo lugar, evitando duplicación e inconsistencia. En resumen: 1NF
      = columnas atómicas, sin grupos repetidos; 2NF = sin dependencia parcial de parte de una llave compuesta;
      3NF = sin dependencia transitiva de columnas que no son llave.'
  - id: w03-sql-s3-c2
    front: What is denormalization, and when is it justified?
    front_es: ¿Qué es la desnormalización, y cuándo se justifica?
    back: Deliberately duplicating or combining data to speed up reads (fewer joins), usually for reporting
      or high-read paths — a conscious trade-off, not a shortcut for skipping schema design.
    back_es: Duplicar o combinar datos a propósito para acelerar lecturas (menos joins), normalmente para
      reportes o rutas de alta lectura — un trade-off consciente, no un atajo por no diseñar el schema
      bien.
