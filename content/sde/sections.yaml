    front: What is O(1) time complexity?
    front_es: ¿Qué es complejidad O(1)?
    back: 'Constant time: the number of operations does not grow as the input n grows (array index access,
      hash map lookup).'
    back_es: 'Tiempo constante: el número de operaciones no crece con n (acceder un índice de arreglo,
      lookup en hash map).'
  - id: w01-big-o-s1-c2
    front: What is O(n) time complexity?
    front_es: ¿Qué es complejidad O(n)?
    back: 'Linear time: one pass through the input; work grows proportionally with n (a single loop over
      the array).'
    back_es: 'Tiempo lineal: un solo recorrido de la entrada; el trabajo crece proporcional a n (un solo
      loop sobre el arreglo).'
  - id: w01-big-o-s1-c3
    front: What is O(n²) time complexity, with an example?
    front_es: ¿Qué es complejidad O(n²), con un ejemplo?
    back: 'Quadratic time: a loop nested inside another loop over the same input — e.g. the brute-force
      Two Sum that checks every pair.'
    back_es: 'Tiempo cuadrático: un loop anidado dentro de otro sobre la misma entrada — ej. el Two Sum
      brute force que revisa cada par.'
  - id: w01-big-o-s1-c4
    front: What's the time and space complexity of brute-force Two Sum vs the hash-map version?
    front_es: ¿Cuál es la complejidad de tiempo y espacio de Two Sum brute force vs la versión con hash
      map?
    back: 'Brute force (nested loops over every pair): O(n²) time, O(1) space. Hash-map version (one pass,
      check complement): O(n) time, O(n) space.'
    back_es: 'Brute force (loops anidados sobre cada par): O(n²) tiempo, O(1) espacio. Versión con hash
      map (un pass, revisa el complemento): O(n) tiempo, O(n) espacio.'
