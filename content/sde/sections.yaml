    front: What's the difference between INNER JOIN and LEFT JOIN?
    front_es: ¿Cuál es la diferencia entre INNER JOIN y LEFT JOIN?
    back: INNER JOIN returns only rows with a match in both tables. LEFT JOIN returns all rows from the
      left table, with NULLs for the right side when there's no match.
    back_es: INNER JOIN regresa solo las filas con match en ambas tablas. LEFT JOIN regresa todas las
