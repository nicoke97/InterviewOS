    front: What's the difference between ASP.NET Core middleware and MVC filters?
    front_es: ¿Cuál es la diferencia entre el middleware de ASP.NET Core y los filters de MVC?
    back: Middleware operates on the raw HTTP pipeline for every request (logging, auth, exception handling
      globally). Filters hook into the MVC/endpoint execution pipeline around a specific controller action.
    back_es: El middleware opera en el pipeline HTTP crudo para cada request (logging, auth, manejo de
      excepciones global). Los filters se enganchan en el pipeline de ejecución de MVC/endpoint alrededor
      de una acción de controller específica.
  - id: w11-di-asp-s3-c2
    front: Give an example of something you'd implement as middleware vs as an action filter.
    front_es: Da un ejemplo de algo que implementarías como middleware vs como action filter.
    back: Global request logging or a top-level exception handler → middleware. Validating one action's
      model state or applying an authorization rule to one controller → filter.
    back_es: Logging global de requests o un manejador de excepciones global → middleware. Validar el
      model state de una acción o aplicar una regla de autorización a un controller → filter.
