    front: What does the await keyword actually do?
    front_es: ¿Qué hace en realidad la palabra await?
    back: It suspends the async method and releases the current thread back to the pool while the awaited
      operation completes; when it finishes, the rest of the method resumes (possibly on a different thread).
    back_es: Suspende el método async y libera el thread actual al pool mientras la operación esperada
      termina; cuando acaba, el resto del método continúa (posiblemente en otro thread).
  - id: w07-async-cs-s2-c2
    front: Why does async I/O improve server throughput compared to sync blocking calls?
    front_es: ¿Por qué el I/O async mejora el throughput del servidor comparado con llamadas sync bloqueantes?
    back: Threads aren't held hostage waiting on I/O, so the same thread pool can serve many more concurrent
      requests.
    back_es: Los threads no quedan atrapados esperando I/O, así que el mismo thread pool puede atender
      muchas más requests concurrentes.
