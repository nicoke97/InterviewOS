  - id: w09-linq-s1-c2
    front: What does .ToList() do to a LINQ query?
    front_es: ¿Qué le hace .ToList() a una query LINQ?
    back: It materializes the query immediately — runs it now and copies the results into a concrete List<T>,
      ending deferred execution.
    back_es: Materializa la query de inmediato — la corre ahora y copia los resultados a un List<T> concreto,
      terminando la ejecución diferida.
