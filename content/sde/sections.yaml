    front: What's the difference between parallelism and concurrency?
    front_es: ¿Cuál es la diferencia entre paralelismo y concurrencia?
    back: Parallelism runs multiple computations at the same time on multiple CPU cores (for CPU-bound
      work). Concurrency manages multiple in-progress tasks that interleave — often by overlapping their
      waiting time (I/O-bound), even on a single core.
    back_es: El paralelismo corre varios cómputos al mismo tiempo en varios cores de CPU (para trabajo
      CPU-bound). La concurrencia maneja varias tareas en progreso que se entrelazan — normalmente traslapando
      su tiempo de espera (I/O-bound), incluso en un solo core.
