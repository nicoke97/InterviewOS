  cards:
  - id: w12-solid-s2-c1
    front: What does the Liskov Substitution Principle (the L in SOLID) require?
    front_es: ¿Qué exige el Principio de Sustitución de Liskov (la L de SOLID)?
    back: A subclass must be substitutable for its base class without breaking correctness — callers using
      the base type shouldn't notice or break when given a derived instance.
    back_es: Una subclase debe poder sustituir a su clase base sin romper la corrección — quien usa el
      tipo base no debería notar ni romperse al recibir una instancia derivada.
  - id: w12-solid-s2-c2
    front: What does the Interface Segregation Principle (the I in SOLID) say?
    front_es: ¿Qué dice el Principio de Segregación de Interfaces (la I de SOLID)?
    back: Prefer several small, specific interfaces over one large general-purpose interface, so clients
      aren't forced to depend on methods they don't use.
    back_es: Prefiere varias interfaces pequeñas y específicas en vez de una interfaz grande de propósito
      general, así los clientes no dependen de métodos que no usan.
  - id: w12-solid-s2-c3
    front: What does the Dependency Inversion Principle (the D in SOLID) say?
    front_es: ¿Qué dice el Principio de Inversión de Dependencias (la D de SOLID)?
    back: High-level code should depend on abstractions (interfaces), not concrete low-level implementations
      — both should depend on the abstraction, not on each other directly.
    back_es: El código de alto nivel debería depender de abstracciones (interfaces), no de implementaciones
      concretas de bajo nivel — ambos deberían depender de la abstracción, no uno del otro directamente.
  standard_minutes: 35
