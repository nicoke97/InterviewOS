  cards:
  - id: w10-ef-s3-c1
    front: In EF Core, what's the difference between .Include() and a projection (.Select()) to avoid
      N+1?
    front_es: En EF Core, ¿cuál es la diferencia entre .Include() y una proyección (.Select()) para evitar
      el N+1?
    back: Include eager-loads the full related entities alongside the parent in one query. A projection
      selects just the specific fields you need — often more efficient when you don't need the whole related
      entity.
    back_es: Include carga de forma eager las entidades relacionadas completas junto con el padre en una
      sola query. Una proyección selecciona solo los campos que necesitas — normalmente más eficiente
      cuando no necesitas toda la entidad relacionada.
