  cards:
  - id: w07-async-cs-s1-c1
    front: Does async/await in C# create a new thread?
    front_es: ¿async/await en C# crea un thread nuevo?
    back: No — async is about not blocking a thread while waiting on I/O. The continuation resumes on
      a pooled thread; await does not spin up a dedicated thread per call.
    back_es: No — async es sobre no bloquear un thread mientras esperas I/O. La continuación se reanuda
      en un thread del pool; await no crea un thread dedicado por cada llamada.
  - id: w07-async-cs-s1-c2
    front: 'What kind of work is async/await meant for: CPU-bound or I/O-bound?'
    front_es: '¿Para qué tipo de trabajo es async/await: CPU-bound o I/O-bound?'
    back: I/O-bound work (HTTP calls, database queries, file access) — the thread is freed to do other
      work while waiting, instead of blocking.
    back_es: Trabajo I/O-bound (llamadas HTTP, queries a base de datos, acceso a archivos) — el thread
      queda libre para hacer otra cosa mientras espera, en vez de bloquearse.
