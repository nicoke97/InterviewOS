    front: What does a database index do, and what's the trade-off?
    front_es: ¿Qué hace un índice en la base de datos, y cuál es el trade-off?
    back: It speeds up WHERE filtering and JOINs by avoiding full table scans, at the cost of extra disk
      space and slower writes (every insert/update/delete must also update the index).
    back_es: Acelera el filtrado de WHERE y los JOINs evitando full table scans, a costa de más espacio
      en disco y writes más lentos (cada insert/update/delete también actualiza el índice).
  - id: w03-sql-s2-c2
    front: What happens if a foreign key column has no index and you join on it?
    front_es: ¿Qué pasa si una columna de foreign key no tiene índice y haces join con ella?
    back: The database does a full table scan on that table for the join, which is slow on large tables.
    back_es: La base de datos hace un full table scan en esa tabla para el join, lo cual es lento en tablas
      grandes.
  - id: w03-sql-s2-c3
    front: Should you index every column? Why or why not?
    front_es: ¿Deberías indexar todas las columnas? ¿Por qué sí o no?
    back: No — indexes cost write performance and storage. Index the columns actually used in WHERE, JOIN,
      and ORDER BY that meaningfully help query performance.
    back_es: No — los índices cuestan rendimiento de escritura y espacio. Indexa las columnas que de verdad
      se usan en WHERE, JOIN y ORDER BY y que ayudan al rendimiento.
