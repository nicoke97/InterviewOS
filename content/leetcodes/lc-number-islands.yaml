hints:
- Por cada '1' no visitado, DFS/BFS marca toda la isla como visitada.
- Incrementa contador por cada componente nueva.
- Marca visitados in-place o con set de (r,c).
approach: Modela nodos y aristas; elige BFS (mínimos pasos/capa), DFS (componentes,
  ciclos) o topological sort (dependencias). Marca visitados para no repetir.
learning:
- BFS vs DFS — cuándo cada uno
- Detección de ciclos y orden topológico
- Grid como grafo implícito (4/8 direcciones)
interview_questions:
- '¿Representación: lista de adyacencia vs matriz?'
- ¿Cómo detectas un ciclo?
- Complejidad en V vértices y E aristas
solution_code: "def num_islands(grid):\n    if not grid:\n        return 0\n    rows,\
  \ cols = len(grid), len(grid[0])\n    count = 0\n    def dfs(r, c):\n        if\
  \ r < 0 or c < 0 or r >= rows or c >= cols or grid[r][c] != '1':\n            return\n\
  \        grid[r][c] = '0'\n        dfs(r + 1, c)\n        dfs(r - 1, c)\n      \
  \  dfs(r, c + 1)\n        dfs(r, c - 1)\n    for r in range(rows):\n        for\
  \ c in range(cols):\n            if grid[r][c] == '1':\n                count +=\
  \ 1\n                dfs(r, c)\n    return count"
