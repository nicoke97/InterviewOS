id: lc-max-depth-tree
title: Maximum Depth of Binary Tree
fn_name: max_depth
description: 'Dado un árbol binario en representación por niveles (arreglo donde None
  significa nodo vacío), devuelve su profundidad máxima.


  La profundidad es el número de nodos a lo largo del camino más largo desde la raíz
  hasta un nodo hoja.'
topic: trees
difficulty: easy
global_order: 20
leetcode_ref: 104
track: leetcodes
test_cases:
- args:
  - - 3
    - 9
    - 20
    - null
    - null
    - 15
    - 7
  expected: 3
- args:
  - - 1
    - null
    - 2
  expected: 2
hints:
- 'DFS: 1 + max(depth izq, depth der); None -> 0.'
- 'BFS: cuenta niveles con cola.'
- 'Caso base: nodo None retorna 0.'
approach: Recorridos DFS (pre/in/post) o BFS por niveles. Define el caso base (None),
  qué retornas en cada nodo y cómo combinas hijos izquierdo/derecho.
learning:
- DFS recursivo vs iterativo con stack
- BFS con cola para niveles
- Propagar min/max en BST validation
interview_questions:
- ¿Recursivo o iterativo — cuándo cada uno?
- ¿Complejidad en árbol balanceado vs degenerado?
- ¿Cómo serializar/deserializar el árbol?
solution_code: "def max_depth(nodes):\n    if not nodes:\n        return 0\n    def\
  \ dfs(i):\n        if i >= len(nodes) or nodes[i] is None:\n            return 0\n\
  \        return 1 + max(dfs(2 * i + 1), dfs(2 * i + 2))\n    return dfs(0)"
tiers:
