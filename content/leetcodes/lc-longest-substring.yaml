    - ¿Cuál es la complejidad temporal y espacial?
    - ¿Qué casos borde probaste?
    hints_allowed: true
  3:
    starter_code: "def length_of_longest(*args):\n    pass"
    narration_prompts: []
    hints_allowed: false
