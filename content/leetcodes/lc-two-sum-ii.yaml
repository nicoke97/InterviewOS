    narration_prompts:
    - Explica tu enfoque en voz alta paso a paso
    - ¿Cuál es la complejidad temporal y espacial?
    - ¿Qué casos borde probaste?
    hints_allowed: true
  3:
    starter_code: "def two_sum_ii(*args):\n    pass"
    narration_prompts: []
    hints_allowed: false
