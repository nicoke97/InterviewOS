id: lc-validate-bst
title: Validate BST
fn_name: is_valid_bst
description: 'Dado un árbol binario en representación por niveles, determina si es
  un árbol binario de búsqueda (BST) válido.


  Un BST válido cumple que el subárbol izquierdo de cada nodo contiene solo valores
  menores y el subárbol derecho solo valores mayores.'
topic: trees
difficulty: medium
global_order: 22
leetcode_ref: 98
track: leetcodes
test_cases:
- args:
  - - 2
    - 1
    - 3
  expected: true
- args:
  - - 5
    - 1
    - 4
    - null
    - null
    - 3
    - 6
  expected: false
hints:
- Pasa rango (min, max) válido por nodo.
- Nodo debe estar en (min, max); valida subárboles con rangos actualizados.
- None siempre es válido.
approach: Recorridos DFS (pre/in/post) o BFS por niveles. Define el caso base (None),
  qué retornas en cada nodo y cómo combinas hijos izquierdo/derecho.
learning:
- DFS recursivo vs iterativo con stack
- BFS con cola para niveles
- Propagar min/max en BST validation
interview_questions:
- ¿Recursivo o iterativo — cuándo cada uno?
- ¿Complejidad en árbol balanceado vs degenerado?
- ¿Cómo serializar/deserializar el árbol?
solution_code: "def is_valid_bst(nodes):\n    if not nodes:\n        return True\n\
  \    def build(i):\n        if i >= len(nodes) or nodes[i] is None:\n          \
  \  return None\n        return {'v': nodes[i], 'l': build(2 * i + 1), 'r': build(2\
  \ * i + 2)}\n    def valid(node, lo, hi):\n        if not node:\n            return\
  \ True\n        v = node['v']\n        if v <= lo or v >= hi:\n            return\
  \ False\n        return valid(node['l'], lo, v) and valid(node['r'], v, hi)\n  \
  \  return valid(build(0), float('-inf'), float('inf'))"
tiers:
  1:
    starter_code: "def is_valid_bst(nodes):\n    return False"
    explain_checklist:
    - Lee el enunciado y los ejemplos
    - Identifica entradas, salida y casos borde
    - Piensa en el patrón antes de escribir código
    hints_allowed: true
  2:
    starter_code: "def is_valid_bst(*args):\n    pass"
    narration_prompts:
    - Explica tu enfoque en voz alta paso a paso
    - ¿Cuál es la complejidad temporal y espacial?
    - ¿Qué casos borde probaste?
    hints_allowed: true
  3:
    starter_code: "def is_valid_bst(*args):\n    pass"
    narration_prompts: []
    hints_allowed: false
