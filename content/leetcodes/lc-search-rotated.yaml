id: lc-search-rotated
title: Search in Rotated Sorted Array
fn_name: search_rotated
description: 'Dado un arreglo nums ordenado en orden ascendente que fue rotado entre
  1 y n posiciones, y un entero target, devuelve el índice de target si está en nums,
  o -1 si no está.


  Debes resolverlo con complejidad O(log n).'
topic: binary_search
difficulty: medium
global_order: 16
leetcode_ref: 33
track: leetcodes
test_cases:
- args:
  - - 4
    - 5
    - 6
    - 7
    - 0
    - 1
    - 2
  - 0
  expected: 4
- args:
  - - 4
    - 5
    - 6
    - 7
    - 0
    - 1
    - 2
  - 3
  expected: -1
hints:
- 'Binary search: una mitad siempre está ordenada.'
- Comprueba si target está en la mitad ordenada; si no, busca en la otra.
- Identifica mitad ordenada comparando nums[mid] con nums[lo].
approach: 'Si el espacio de búsqueda es monótono (sorted array o respuesta sí/no),
  usa binary search. Define bien lo que buscas: índice, valor o condición mínima que
  cumple.'
learning:
- 'Invariante: la respuesta está en [lo, hi]'
- Diferencia entre buscar valor exacto vs primera posición válida
- Binary search en espacio de respuestas (no solo arrays)
interview_questions:
- ¿Por qué O(log n) y cuándo no aplica?
- ¿Cómo evitas off-by-one en los límites?
- ¿Qué haces si el array está rotado?
solution_code: "def search_rotated(nums, target):\n    lo, hi = 0, len(nums) - 1\n\
  \    while lo <= hi:\n        mid = (lo + hi) // 2\n        if nums[mid] == target:\n\
  \            return mid\n        if nums[lo] <= nums[mid]:\n            if nums[lo]\
  \ <= target < nums[mid]:\n                hi = mid - 1\n            else:\n    \
  \            lo = mid + 1\n        else:\n            if nums[mid] < target <= nums[hi]:\n\
  \                lo = mid + 1\n            else:\n                hi = mid - 1\n\
  \    return -1"
