id: lc-3sum
title: 3Sum
fn_name: three_sum
description: 'Dado un arreglo de enteros nums, devuelve todas las tripletas únicas
  [nums[i], nums[j], nums[k]] tales que i != j, i != k, j != k y nums[i] + nums[j]
  + nums[k] == 0.


  La lista de salida no debe contener tripletas duplicadas.'
topic: two_pointers
difficulty: medium
global_order: 9
leetcode_ref: 15
track: leetcodes
test_cases:
- args:
  - - -1
    - 0
    - 1
    - 2
    - -1
    - -4
  expected:
  - - -1
    - -1
    - 2
  - - -1
    - 0
    - 1
- args:
  - - 0
    - 1
    - 1
  expected: []
hints:
- Ordena nums; fija i y busca par con two sum en i+1..n-1.
- Si nums[i] == nums[i-1], salta duplicados en i.
- Igual al mover left/right cuando encuentras tripletas.
approach: Con dos punteros (o uno a cada extremo) puedes reducir búsquedas O(n²) a
  O(n). Funciona bien en arrays ordenados o cuando buscas pares/tripletas con condiciones
  monótonas.
learning:
- Puntero izquierdo/derecho en arrays ordenados
- Cuándo mover cada puntero según la suma o comparación
- Evitar tripletas duplicadas con sort + skip
interview_questions:
- ¿Por qué two pointers y no hash map aquí?
- ¿Qué casos borde hay (array vacío, sin solución)?
- ¿Cuál es la complejidad y se puede mejorar?
solution_code: "def three_sum(nums):\n    nums.sort()\n    out = []\n    for i in\
  \ range(len(nums)):\n        if i > 0 and nums[i] == nums[i - 1]:\n            continue\n\
  \        left, right = i + 1, len(nums) - 1\n        while left < right:\n     \
  \       s = nums[i] + nums[left] + nums[right]\n            if s == 0:\n       \
  \         out.append([nums[i], nums[left], nums[right]])\n                left +=\
  \ 1\n                right -= 1\n                while left < right and nums[left]\
  \ == nums[left - 1]:\n                    left += 1\n            elif s < 0:\n \
  \               left += 1\n            else:\n                right -= 1\n    return\
  \ out"
