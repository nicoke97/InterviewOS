id: lc-merge-two-lists
title: Merge Two Sorted Lists
fn_name: merge_lists
description: 'Dadas dos listas enlazadas ordenadas representadas como arreglos a y
  b, fusionalas en una sola lista ordenada y devuelve sus valores.


  El resultado debe formarse concatenando los nodos de a y b en orden creciente.'
topic: linked_list
difficulty: easy
global_order: 18
leetcode_ref: 21
track: leetcodes
test_cases:
- args:
  - - 1
    - 2
    - 4
  - - 1
    - 3
    - 4
  expected:
  - 1
  - 1
  - 2
  - 3
  - 4
  - 4
- args:
  - []
  - []
  expected: []
hints:
- Dummy head + puntero tail; compara heads de a y b.
- Enlaza el menor y avanza ese puntero.
- Al terminar, enlaza el resto no vacío.
approach: En listas enlazadas usa punteros lentos/rápidos (Floyd), prev para invertir,
  o dummy head para simplificar bordes. Dibuja los punteros antes de codear.
learning:
- Dummy node para evitar casos especiales en head
- Fast/slow pointers para ciclos y mitad
- Invertir y fusionar reconectando next
interview_questions:
- ¿Complejidad temporal y espacial?
- ¿Cómo detectarías un ciclo sin set extra?
- ¿Iterativo vs recursivo — trade-offs?
solution_code: "def merge_lists(a, b):\n    i = j = 0\n    out = []\n    while i <\
  \ len(a) and j < len(b):\n        if a[i] <= b[j]:\n            out.append(a[i])\n\
  \            i += 1\n        else:\n            out.append(b[j])\n            j\
  \ += 1\n    out.extend(a[i:])\n    out.extend(b[j:])\n    return out"
