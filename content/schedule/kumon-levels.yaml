checkpoints:
  a:
    A: [a-cp-sum-pair]
    B: [a-cp-reverse-string]
    C: [a-cp-fizzbuzz]
    D: [a-cp-grade]
  b:
    A: [b-cp-sum-range]
    B: [b-cp-count-positive]
    C: [b-cp-pair-sums]
    D: [b-cp-apply-twice]
  c:
    A: [c-cp-list-sum]
    B: [c-cp-reverse-list]
    C: [c-cp-evens]
    D: [c-cp-word-count]
  d:
    A: [d-cp-merge-dicts]
    B: [d-cp-word-freq]
    C: [d-cp-unique]
    D: [d-cp-safe-div]
  e:
    A: [e-cp-counter]
    B: [e-cp-bank]
    C: [e-cp-point-str]
    D: [e-cp-shape-area]

# Examen de conclusion de nivel (pagina 200): LeetCode + Interview de todo el nivel.
completion_exam:
  a:
    leetcode: [a-exam-temperature, a-exam-leap-year]
    interview: [a-int-1, a-int-2]
  b:
    leetcode: [b-exam-factorial, b-exam-collatz]
    interview: [b-int-1, b-int-2]
  c:
    leetcode: [c-exam-second-largest, c-exam-anagram]
    interview: [c-int-1, c-int-2]
  d:
    leetcode: [d-exam-group-by, d-exam-two-sum]
    interview: [d-int-1, d-int-2]
  e:
    leetcode: [e-exam-stack, e-exam-shapes]
    interview: [e-int-1, e-int-2]
