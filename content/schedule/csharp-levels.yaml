# Examen de conclusión de nivel (página 200): LeetCode + Interview de todo el nivel.
completion_exam:
  sa:
    leetcode: [sa-exam-temperature, sa-exam-leap-year]
    interview: [sa-int-1, sa-int-2]
  sb:
    leetcode: [sb-exam-factorial, sb-exam-collatz]
    interview: [sb-int-1, sb-int-2]
  sc:
    leetcode: [sc-exam-second-largest, sc-exam-anagram]
    interview: [sc-int-1, sc-int-2]
  sd:
    leetcode: [sd-exam-group-by, sd-exam-two-sum]
    interview: [sd-int-1, sd-int-2]
  se:
    leetcode: [se-exam-stack, se-exam-shapes]
    interview: [se-int-1, se-int-2]
