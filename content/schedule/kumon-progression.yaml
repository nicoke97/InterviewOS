# Reglas de progresion del modelo Kumon por dominio + Orientador de sesion.

model: domain_mastery

session:
  default_pages: 10
  min_pages: 3
  options: [3, 5, 10]

mastery:
  require_all_correct: true
  self_correction_allowed: true
  time_tolerance: 1.0
  first_attempt_threshold: 0.90

repeat:
  on_fail: schedule_next_day
  spaced_repeat_days: 1

orientador:
  minute_presets: [20, 30, 40, 60]
  min_minutes: 15
  max_minutes: 90
  min_activity_minutes: 5

pre_exam:
  enabled: true
  include_failure_history: true
  max_sets: 3

checkpoint:
  every_pages: 50
  required_to_advance_block: true

exam:
  at_page: 200
  unlocks_next_level: true
