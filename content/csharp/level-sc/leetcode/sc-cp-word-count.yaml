id: sc-cp-word-count
title: Contar palabras
fn_name: WordCount
description: Cuenta cuántas palabras tiene el texto.
test_cases:
- args:
  - hola mundo python
  expected: 3
- args:
  - ''
  expected: 0
hints:
- Identifica qué operación pide el enunciado.
- Empieza con el caso más simple y luego los casos borde.
- Prueba con los ejemplos del enunciado.
approach: Lee el enunciado, identifica entradas/salida y resuélvelo paso a paso.
learning:
- Traducir el enunciado a C#
- Probar con los ejemplos
- Manejar casos borde
interview_questions:
- ¿Cuál es la complejidad de tu solución?
- ¿Qué casos borde consideraste?
- ¿Hay una forma más eficiente?
solution_code: 'int WordCount(string s) => string.IsNullOrWhiteSpace(s) ? 0 : s.Split(''
  '').Length;'
tiers:
  1:
    starter_code: "int WordCount(string s)\n{\n    return 0;\n}"
    explain_checklist:
