id: sd-cp-word-freq
title: Frecuencia de palabras
fn_name: Frecuencia
description: Cuenta cada palabra y retorna un diccionario.
test_cases:
- args:
  - a b a
  expected:
    a: 2
    b: 1
hints:
- Identifica qué operación pide el enunciado.
- Empieza con el caso más simple y luego los casos borde.
- Prueba con los ejemplos del enunciado.
approach: Lee el enunciado, identifica entradas/salida y resuélvelo paso a paso.
learning:
- Traducir el enunciado a C#
- Probar con los ejemplos
- Manejar casos borde
interview_questions:
- ¿Cuál es la complejidad de tu solución?
- ¿Qué casos borde consideraste?
- ¿Hay una forma más eficiente?
solution_code: "Dictionary<string, int> Frecuencia(string texto)\n{\n    var freq\
  \ = new Dictionary<string, int>();\n    foreach (string w in texto.Split(' ')) freq[w]\
  \ = freq.GetValueOrDefault(w) + 1;\n    return freq;\n}"
tiers:
  1:
    starter_code: "Dictionary<string, int> Frecuencia(string texto)\n{\n    var freq\
      \ = new Dictionary<string, int>();\n    // recorre texto.Split(' ')\n    return\
      \ freq;\n}"
    explain_checklist:
    - Lee el enunciado y los ejemplos
    - Identifica entradas, salida y casos borde
    - Piensa en el patrón antes de escribir código
    hints_allowed: true
  2:
    starter_code: "Dictionary<string, int> Frecuencia(string texto)\n{\n    var freq\
      \ = new Dictionary<string, int>();\n    // recorre texto.Split(' ')\n    return\
      \ freq;\n}"
    narration_prompts:
    - Explica tu enfoque en voz alta paso a paso
    - ¿Cuál es la complejidad temporal y espacial?
    hints_allowed: true
  3:
    starter_code: "Dictionary<string, int> Frecuencia(string texto)\n{\n    var freq\
      \ = new Dictionary<string, int>();\n    // recorre texto.Split(' ')\n    return\
      \ freq;\n}"
    narration_prompts: []
    hints_allowed: false
