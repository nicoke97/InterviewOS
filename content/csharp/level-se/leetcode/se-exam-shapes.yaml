id: se-exam-shapes
title: Suma de áreas (polimorfismo)
fn_name: TotalArea
description: Dada una lista de lados de cuadrados, suma sus áreas.
test_cases:
- args:
  - - 2
    - 3
  expected: 13
- args:
  - - 1
    - 1
    - 1
  expected: 3
hints:
- Identifica qué operación pide el enunciado.
- Empieza con el caso más simple y luego los casos borde.
- Prueba con los ejemplos del enunciado.
approach: Lee el enunciado, identifica entradas/salida y resuélvelo paso a paso.
learning:
- Traducir el enunciado a C#
- Probar con los ejemplos
- Manejar casos borde
interview_questions:
- ¿Cuál es la complejidad de tu solución?
- ¿Qué casos borde consideraste?
- ¿Hay una forma más eficiente?
solution_code: 'class Cuadrado { public int L; public Cuadrado(int l) { L = l; } public
  int Area() => L * L; }

  int TotalArea(int[] lados) => lados.Select(l => new Cuadrado(l).Area()).Sum();'
