id: se-cp-counter
title: Contador con clase
fn_name: RunCounter
description: Crea una clase Counter, incrementa n veces y retorna el conteo.
test_cases:
- args:
  - 3
  expected: 3
- args:
  - 0
  expected: 0
hints:
- Identifica qué operación pide el enunciado.
- Empieza con el caso más simple y luego los casos borde.
- Prueba con los ejemplos del enunciado.
approach: Lee el enunciado, identifica entradas/salida y resuélvelo paso a paso.
learning:
- Traducir el enunciado a C#
- Probar con los ejemplos
- Manejar casos borde
interview_questions:
- ¿Cuál es la complejidad de tu solución?
- ¿Qué casos borde consideraste?
- ¿Hay una forma más eficiente?
solution_code: "class Counter { public int C; public void Inc() { C++; } }\nint RunCounter(int\
  \ n)\n{\n    var c = new Counter();\n    for (int i = 0; i < n; i++) c.Inc();\n\
  \    return c.C;\n}"
tiers:
  1:
    starter_code: "int RunCounter(int n)\n{\n    // crea un contador, incrementa n\
      \ veces y retorna\n    return 0;\n}"
    explain_checklist:
    - Lee el enunciado y los ejemplos
    - Identifica entradas, salida y casos borde
    - Piensa en el patrón antes de escribir código
    hints_allowed: true
  2:
    starter_code: "int RunCounter(int n)\n{\n    // crea un contador, incrementa n\
      \ veces y retorna\n    return 0;\n}"
    narration_prompts:
    - Explica tu enfoque en voz alta paso a paso
    - ¿Cuál es la complejidad temporal y espacial?
    hints_allowed: true
  3:
    starter_code: "int RunCounter(int n)\n{\n    // crea un contador, incrementa n\
      \ veces y retorna\n    return 0;\n}"
    narration_prompts: []
    hints_allowed: false
