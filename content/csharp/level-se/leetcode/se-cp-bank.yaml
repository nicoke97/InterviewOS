solution_code: "class Cuenta { public int S; public void Deposita(int n) { S += n;\
  \ } }\nint FinalBalance(int[] deps)\n{\n    var c = new Cuenta();\n    foreach (int\
  \ d in deps) c.Deposita(d);\n    return c.S;\n}"
