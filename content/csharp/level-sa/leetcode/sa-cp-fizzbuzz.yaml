id: sa-cp-fizzbuzz
title: FizzBuzz de un número
fn_name: FizzBuzz
description: Retorna 'Fizz','Buzz','FizzBuzz' o el número como texto.
test_cases:
- args:
  - 3
  expected: Fizz
- args:
  - 5
  expected: Buzz
- args:
  - 15
  expected: FizzBuzz
- args:
  - 7
  expected: '7'
hints:
- Identifica qué operación pide el enunciado.
- Empieza con el caso más simple y luego los casos borde.
- Prueba con los ejemplos del enunciado.
approach: Lee el enunciado, identifica entradas/salida y resuélvelo paso a paso.
learning:
- Traducir el enunciado a C#
- Probar con los ejemplos
- Manejar casos borde
interview_questions:
- ¿Cuál es la complejidad de tu solución?
- ¿Qué casos borde consideraste?
- ¿Hay una forma más eficiente?
solution_code: "string FizzBuzz(int n)\n{\n    if (n % 15 == 0) return \"FizzBuzz\"\
  ;\n    if (n % 3 == 0) return \"Fizz\";\n    if (n % 5 == 0) return \"Buzz\";\n\
  \    return n.ToString();\n}"
tiers:
  1:
    starter_code: "string FizzBuzz(int n)\n{\n    // usa n % 3 y n % 5\n    return\
      \ n.ToString();\n}"
    explain_checklist:
    - Lee el enunciado y los ejemplos
    - Identifica entradas, salida y casos borde
    - Piensa en el patrón antes de escribir código
    hints_allowed: true
  2:
    starter_code: "string FizzBuzz(int n)\n{\n    // usa n % 3 y n % 5\n    return\
      \ n.ToString();\n}"
    narration_prompts:
    - Explica tu enfoque en voz alta paso a paso
    - ¿Cuál es la complejidad temporal y espacial?
    hints_allowed: true
  3:
    starter_code: "string FizzBuzz(int n)\n{\n    // usa n % 3 y n % 5\n    return\
      \ n.ToString();\n}"
    narration_prompts: []
    hints_allowed: false
