id: sb-cp-count-positive
title: Contar positivos
fn_name: CountPositive
description: Cuenta cuántos números son > 0.
test_cases:
- args:
  - - 1
    - -2
    - 3
    - 0
    - 5
  expected: 3
- args:
  - - -1
    - -2
  expected: 0
hints:
- Identifica qué operación pide el enunciado.
- Empieza con el caso más simple y luego los casos borde.
- Prueba con los ejemplos del enunciado.
approach: Lee el enunciado, identifica entradas/salida y resuélvelo paso a paso.
learning:
- Traducir el enunciado a C#
- Probar con los ejemplos
- Manejar casos borde
interview_questions:
- ¿Cuál es la complejidad de tu solución?
- ¿Qué casos borde consideraste?
- ¿Hay una forma más eficiente?
solution_code: "int CountPositive(int[] nums)\n{\n    int c = 0;\n    foreach (int\
  \ n in nums) if (n > 0) c++;\n    return c;\n}"
tiers:
  1:
    starter_code: "int CountPositive(int[] nums)\n{\n    int c = 0;\n    // recorre\
      \ nums\n    return c;\n}"
    explain_checklist:
