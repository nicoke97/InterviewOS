id: group-anagrams
title: Group Anagrams
fn_name: group_anagrams
description: Group strings that are anagrams.
test_cases:
- args:
  - - eat
    - tea
    - tan
    - ate
    - nat
    - bat
  expected:
  - - eat
    - tea
    - ate
  - - tan
    - nat
  - - bat
