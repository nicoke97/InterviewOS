    - Sorted tuple as dict key
    hints_allowed: true
  2:
    starter_code: "def group_anagrams(strs):\n    pass"
    narration_prompts:
    - Why tuple key?
    hints_allowed: true
  3:
    starter_code: "def group_anagrams(strs):\n    pass"
    narration_prompts: []
