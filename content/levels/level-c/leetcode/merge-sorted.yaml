id: merge-sorted
title: Merge Sorted Lists
fn_name: merge_sorted
description: Merge two sorted lists into one sorted list.
test_cases:
- args:
  - - 1
    - 3
    - 5
  - - 2
    - 4
    - 6
  expected:
  - 1
  - 2
  - 3
  - 4
  - 5
  - 6
tiers:
  1:
    starter_code: "def merge_sorted(a, b):\n    result = []\n    i = j = 0\n    while\
      \ i < len(a) and j < len(b):\n        if a[i] < b[j]:\n            result.append(a[i]);\
      \ i += 1\n        else:\n            result.append(b[j]); j += 1\n    return\
      \ result + a[i:] + b[j:]"
    explain_checklist:
    - Two pointer technique
    hints_allowed: true
  2:
    starter_code: "def merge_sorted(a, b):\n    pass"
    narration_prompts:
    - Explain two pointers
    hints_allowed: true
  3:
    starter_code: "def merge_sorted(a, b):\n    pass"
    narration_prompts: []
    hints_allowed: false
