    - Identifica entradas y salidas
    - Piensa en casos borde
    hints_allowed: true
  2:
    starter_code: "def fizzbuzz(*args):\n    pass"
    narration_prompts:
    - Explica tu enfoque en voz alta
    - Cual es la complejidad?
    hints_allowed: true
  3:
    starter_code: "def fizzbuzz(*args):\n    pass"
    narration_prompts: []
    hints_allowed: false
