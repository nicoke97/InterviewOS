id: a-cp-fizzbuzz
title: FizzBuzz de un numero
fn_name: fizzbuzz
description: Retorna 'Fizz','Buzz','FizzBuzz' o el numero como texto.
test_cases:
- args:
  - 3
  expected: Fizz
- args:
  - 5
  expected: Buzz
- args:
  - 15
  expected: FizzBuzz
- args:
  - 7
  expected: '7'
tiers:
