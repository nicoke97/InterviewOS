id: a-cp-fizzbuzz
title: FizzBuzz de un numero
fn_name: fizzbuzz
description: Retorna 'Fizz','Buzz','FizzBuzz' o el numero como texto.
test_cases:
- args:
  - 3
  expected: Fizz
- args:
  - 5
  expected: Buzz
- args:
  - 15
  expected: FizzBuzz
- args:
  - 7
  expected: '7'
hints:
- Divisible por 15 → FizzBuzz; por 3 → Fizz; por 5 → Buzz.
- Usa if/elif en ese orden.
approach: Lee el enunciado, identifica entradas/salida y resuelve paso a paso con
  la lógica que ya conoces.
learning:
- Traducir enunciado a código Python
- Probar con los ejemplos dados
- Manejar casos borde antes de enviar
interview_questions:
- ¿Cuál es la complejidad de tu solución?
- ¿Qué casos borde consideraste?
- ¿Hay una forma más eficiente?
solution_code: "def fizzbuzz(n):\n    if n % 15 == 0:\n        return 'FizzBuzz'\n\
  \    if n % 3 == 0:\n        return 'Fizz'\n    if n % 5 == 0:\n        return 'Buzz'\n\
  \    return str(n)"
tiers:
  1:
    starter_code: "def fizzbuzz(n):\n    # usa n % 3 y n % 5\n    return ___"
    explain_checklist:
    - Lee el enunciado y los ejemplos
    - Identifica entradas, salida y casos borde
    - Piensa en el patrón antes de escribir código
    hints_allowed: true
  2:
    starter_code: "def fizzbuzz(*args):\n    pass"
    narration_prompts:
    - Explica tu enfoque en voz alta paso a paso
    - ¿Cuál es la complejidad temporal y espacial?
    hints_allowed: true
  3:
    starter_code: "def fizzbuzz(*args):\n    pass"
    narration_prompts: []
    hints_allowed: false
