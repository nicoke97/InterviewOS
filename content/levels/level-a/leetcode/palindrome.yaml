id: palindrome
title: Valid Palindrome
fn_name: is_palindrome
description: Given integer x, return True if x reads the same forward and backward.
test_cases:
- args:
  - 121
  expected: true
- args:
  - -121
  expected: false
- args:
  - 10
  expected: false
tiers:
  1:
    starter_code: "def is_palindrome(x):\n    s = str(x)\n    # Compare s with its\
      \ reverse\n    return ___"
    explain_checklist:
    - What is input type?
    - How to reverse a string?
    - 'Edge case: negative numbers'
    hints_allowed: true
  2:
    starter_code: "def is_palindrome(x):\n    pass"
    narration_prompts:
    - State your approach out loud
    - What are edge cases?
    - What is time complexity?
    hints_allowed: true
  3:
    starter_code: "def is_palindrome(x):\n    pass"
    narration_prompts: []
    hints_allowed: false
