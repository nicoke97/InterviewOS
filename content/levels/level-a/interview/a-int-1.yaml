id: a-int-1
question: Cual es la diferencia entre un entero (int) y una cadena (str)? Da un ejemplo
  de cada uno.
rubric:
- int representa numeros
- str representa texto entre comillas
- se pueden convertir con int()/str()
sample_answer: Un int es un numero (ej. 42) con el que puedes hacer aritmetica; un
  str es texto entre comillas (ej. '42'). Puedes convertir con int('42') o str(42).
category: python
