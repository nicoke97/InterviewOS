id: erp-filter
title: Filter Active Clients
fn_name: filter_active
description: Filter list of client dicts where active=True, sort by name.
test_cases:
- args:
  - - name: B
      active: true
    - name: A
      active: false
    - name: C
      active: true
  expected:
  - name: B
    active: true
  - name: C
    active: true
tiers:
  1:
    starter_code: "def filter_active(clients):\n    active = [c for c in clients if\
      \ c['active']]\n    active.sort(key=lambda c: c['name'])\n    return ___"
    explain_checklist:
    - List comprehension filters
    - sort key=name
    hints_allowed: true
  2:
    starter_code: "def filter_active(clients):\n    pass"
    narration_prompts:
    - Relate to SQL WHERE and ORDER BY
    hints_allowed: true
  3:
    starter_code: "def filter_active(clients):\n    pass"
    narration_prompts: []
    hints_allowed: false
