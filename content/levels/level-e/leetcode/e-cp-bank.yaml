id: e-cp-bank
title: Saldo final
fn_name: final_balance
description: Crea una clase Cuenta con deposito y retorna el saldo final.
test_cases:
- args:
  - - 10
    - 20
    - 5
  expected: 35
- args:
  - []
  expected: 0
hints:
- Identifica qué operación pide el enunciado.
- Empieza con el caso más simple y luego casos borde.
- Prueba con los ejemplos del enunciado.
approach: Lee el enunciado, identifica entradas/salida y resuelve paso a paso con
  la lógica que ya conoces.
learning:
- Traducir enunciado a código Python
- Probar con los ejemplos dados
- Manejar casos borde antes de enviar
interview_questions:
- ¿Cuál es la complejidad de tu solución?
- ¿Qué casos borde consideraste?
- ¿Hay una forma más eficiente?
solution_code: "def final_balance(deps):\n    class Cuenta:\n        def __init__(self):\n\
  \            self.s = 0\n        def deposito(self, n):\n            self.s += n\n\
  \    c = Cuenta()\n    for d in deps:\n        c.deposito(d)\n    return c.s"
tiers:
  1:
    starter_code: "def final_balance(deps):\n    class Cuenta:\n        def __init__(self):\n\
      \            self.s = 0\n        def deposito(self, n):\n            self.s\
      \ += n\n    return ___"
    explain_checklist:
    - Lee el enunciado y los ejemplos
    - Identifica entradas, salida y casos borde
    - Piensa en el patrón antes de escribir código
    hints_allowed: true
  2:
    starter_code: "def final_balance(*args):\n    pass"
    narration_prompts:
    - Explica tu enfoque en voz alta paso a paso
    - ¿Cuál es la complejidad temporal y espacial?
    hints_allowed: true
  3:
    starter_code: "def final_balance(*args):\n    pass"
    narration_prompts: []
    hints_allowed: false
