id: e-exam-stack
title: Pila (Stack)
fn_name: stack_top
description: Crea una Stack con push/pop; aplica las operaciones y retorna el tope.
test_cases:
- args:
  - - 1
    - 2
    - 3
  expected: 3
- args:
  - - 5
  expected: 5
hints:
- Identifica qué operación pide el enunciado.
- Empieza con el caso más simple y luego casos borde.
- Prueba con los ejemplos del enunciado.
approach: Lee el enunciado, identifica entradas/salida y resuelve paso a paso con
  la lógica que ya conoces.
learning:
- Traducir enunciado a código Python
- Probar con los ejemplos dados
- Manejar casos borde antes de enviar
interview_questions:
- ¿Cuál es la complejidad de tu solución?
- ¿Qué casos borde consideraste?
- ¿Hay una forma más eficiente?
solution_code: "def stack_top(valores):\n    class Stack:\n        def __init__(self):\n\
  \            self.data = []\n        def push(self, x):\n            self.data.append(x)\n\
  \        def top(self):\n            return self.data[-1]\n    s = Stack()\n   \
  \ for v in valores:\n        s.push(v)\n    return s.top()"
tiers:
  1:
    starter_code: "def stack_top(valores):\n    class Stack:\n        def __init__(self):\n\
      \            self.data = []\n        def push(self, x):\n            self.data.append(x)\n\
      \        def top(self):\n            return self.data[-1]\n    return ___"
    explain_checklist:
    - Lee el enunciado y los ejemplos
    - Identifica entradas, salida y casos borde
    - Piensa en el patrón antes de escribir código
    hints_allowed: true
  2:
    starter_code: "def stack_top(*args):\n    pass"
    narration_prompts:
    - Explica tu enfoque en voz alta paso a paso
    - ¿Cuál es la complejidad temporal y espacial?
    hints_allowed: true
  3:
    starter_code: "def stack_top(*args):\n    pass"
    narration_prompts: []
    hints_allowed: false
