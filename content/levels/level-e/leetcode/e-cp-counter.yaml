id: e-cp-counter
title: Contador con clase
fn_name: run_counter
description: Crea una clase Counter, incrementa n veces y retorna el conteo.
test_cases:
- args:
  - 3
  expected: 3
- args:
  - 0
  expected: 0
hints:
- Identifica qué operación pide el enunciado.
- Empieza con el caso más simple y luego casos borde.
- Prueba con los ejemplos del enunciado.
approach: Lee el enunciado, identifica entradas/salida y resuelve paso a paso con
  la lógica que ya conoces.
learning:
- Traducir enunciado a código Python
- Probar con los ejemplos dados
- Manejar casos borde antes de enviar
interview_questions:
- ¿Cuál es la complejidad de tu solución?
- ¿Qué casos borde consideraste?
- ¿Hay una forma más eficiente?
solution_code: "def run_counter(n):\n    class Counter:\n        def __init__(self):\n\
  \            self.c = 0\n        def inc(self):\n            self.c += 1\n    c\
  \ = Counter()\n    for _ in range(n):\n        c.inc()\n    return c.c"
tiers:
  1:
    starter_code: "def run_counter(n):\n    class Counter:\n        def __init__(self):\n\
      \            self.c = 0\n        def inc(self):\n            self.c += 1\n \
      \   # crea, incrementa n veces y retorna\n    return ___"
    explain_checklist:
    - Lee el enunciado y los ejemplos
    - Identifica entradas, salida y casos borde
    - Piensa en el patrón antes de escribir código
    hints_allowed: true
  2:
    starter_code: "def run_counter(*args):\n    pass"
    narration_prompts:
    - Explica tu enfoque en voz alta paso a paso
    - ¿Cuál es la complejidad temporal y espacial?
    hints_allowed: true
  3:
    starter_code: "def run_counter(*args):\n    pass"
    narration_prompts: []
    hints_allowed: false
